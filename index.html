function resetProgress(all){const message=all?"学習記録とブックマークをすべて削除します。この操作は取り消せません。よろしいですか？":"正解数・不正解数・正答率と間違えた問題の記録をリセットします。ブックマークは残ります。よろしいですか？";if(!window.confirm(message))return;if(all){saved={}}else{for(const [id,r] of Object.entries(saved)){if(r.bookmarked){saved[id]={attempts:0,correct:0,wrong:0,bookmarked:true,excludedChoices:Array.isArray(r.excludedChoices)?r.excludedChoices:[]}}else{delete saved[id]}}}save();$("mode").value="ordered";$("scope").value="all";start();$("resetPanel").open=false}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(){let a=Object.values(saved),n=a.reduce((s,r)=>s+(r.attempts||0),0),c=a.reduce((s,r)=>s+(r.correct||0),0),w=a.reduce((s,r)=>s+(r.wrong||0),0);$("accuracy").textContent=n?Math.round(c/n*100)+"%":"—";$("correctCount").textContent=c;$("wrongCount").textContent=w;$("progress").textContent=Math.min(pos+(current?1:0),list.length)+" / "+list.length;$("bar").style.width=(list.length?Math.min(pos+(current?1:0),list.length)/list.length*100:0)+"%"}
function start(){let m=$("mode").value;list=QUESTIONS.filter(q=>$("scope").value==="all"||q.category.startsWith("消防関係法令（共通）"));if(m==="review")list=list.filter(q=>{let r=rec(q.id);return r.wrong>0||r.bookmarked});if(m==="random")list=shuffle(list);pos=0;sessionOK=0;current=null;draw()}
function renderDiagram(q){if(!q.diagramType||!q.diagramData)return "";const d=q.diagramData;if(q.diagramType==="building"){const rows=d.floors.map((f,i)=>'<tr class="'+(f.floor==="1階"?"ground-boundary":"")+'"><td>'+esc(f.floor)+'</td><td>'+esc(f.use)+'</td><td>'+esc(f.area)+'</td></tr>').join("");let stairs="";if(d.hasStairs){const n=d.floors.length,h=n*43;let lines="";for(let i=0;i<n-1;i++){const y=i*43+22;lines+='<path d="M 8 '+(y+15)+' L 54 '+(y-15)+'" />';}stairs='<svg class="stair-svg" viewBox="0 0 62 '+h+'" preserveAspectRatio="none" role="img" aria-label="屋内階段"><path d="M 8 0 V '+h+' M 54 0 V '+h+'" fill="none" stroke="#111" stroke-width="1"/>'+lines+'</svg>';}return '<div class="diagram-area"><div class="diagram-title">建物の階層・用途・面積</div><div class="building-wrap"><table class="building-table"><tbody>'+rows+'</tbody></table>'+stairs+'</div></div>';}if(q.diagramType==="alarm_grid"){const cards=d.options.map((o,i)=>'<div class="alarm-option"><div class="alarm-option-title">選択肢 '+(i+1)+'</div><div class="alarm-building">'+d.floors.map(f=>'<div class="alarm-floor '+(f==="1F"?"ground-boundary":"")+'"><span>'+esc(f)+'</span><span class="mark">'+esc(o[f]||"")+'</span></div>').join("")+'</div></div>').join("");return '<div class="diagram-area"><div class="diagram-title">地区音響装置の区分鳴動（◎：出火階、○：警報を発する階）</div><div class="alarm-options">'+cards+'</div><div class="choice-diagram-note">各選択肢の階ごとの鳴動範囲を示しています。</div></div>';}return "";}
function draw(){stats();if(!list.length){$("stage").innerHTML='<section class="card empty"><strong>出題できる問題がありません</strong>間違えた問題も復習チェックもまだありません。通常モードで学習してください。</section>';return}if(pos>=list.length){$("stage").innerHTML='<section class="card empty"><strong>今回の演習は終了！</strong>今回の正解数：'+sessionOK+' / '+list.length+'<p><button class="next" id="again">もう一度解く ↻</button></p></section>';$("again").onclick=start;return}current=list[pos];done=false;selectedChoice=[];currentOrder=current.choices.map((_,i)=>i);if($("choiceOrder").value==="random")currentOrder=shuffle(currentOrder);let r=rec(current.id);const multi=Array.isArray(current.answerIndices);$("stage").innerHTML='<section class="card"><div class="qtop"><span class="tag">'+esc(current.category)+'</span><span>問題 '+(pos+1)+' / '+list.length+'</span></div><div class="qnum">QUESTION '+String(current.id).padStart(3,"0")+'</div><div class="question">'+esc(current.question)+'</div>'+renderDiagram(current)+'<div class="selection-hint" id="selectionHint" style="font-size:13px;color:var(--muted);margin:-8px 0 10px">'+(multi?'正しいと思うものを'+current.answerIndices.length+'つ選択してください（0 / '+current.answerIndices.length+')':'選択肢を1つ選んでください')+'</div><div class="choices">'+currentOrder.map((i,displayIndex)=>'<div class="choice-row"><button type="button" class="choice '+(r.excludedChoices.includes(i)?'excluded':'')+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+esc(current.choices[i])+'</span></button><button type="button" class="exclude-toggle '+(r.excludedChoices.includes(i)?'active':'')+'" data-exclude="'+i+'" aria-label="選択肢 '+(i+1)+' の除外マークを'+(r.excludedChoices.includes(i)?'解除':'付ける')+'" aria-pressed="'+r.excludedChoices.includes(i)+'" title="違うと思う選択肢に×を付ける">×</button></div>').join("")+'</div><div class="actions"><label class="bookmark"><input type="checkbox" id="bookmark" '+(r.bookmarked?"checked":"")+'> あとで復習する</label><button class="next" id="next" disabled>解答する</button></div></section><section class="explain" id="explain" aria-live="polite"></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>selectChoice(+b.dataset.i));document.querySelectorAll(".exclude-toggle").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleExcluded(+b.dataset.exclude)});$("bookmark").onchange=e=>{let x=rec(current.id);x.bookmarked=e.target.checked;saved[current.id]=x;save()};$("next").onclick=()=>{if(done)next();else submitAnswer()};stats()}
function toggleExcluded(i){if(!current||!Number.isInteger(i)||i<0||i>=current.choices.length)return;const r=rec(current.id);const xs=new Set(r.excludedChoices||[]);if(xs.has(i))xs.delete(i);else xs.add(i);r.excludedChoices=[...xs].sort((a,b)=>a-b);saved[current.id]=r;save();const choice=document.querySelector('.choice[data-i="'+i+'"]');const button=document.querySelector('.exclude-toggle[data-exclude="'+i+'"]');if(choice)choice.classList.toggle("excluded",xs.has(i));if(button){button.classList.toggle("active",xs.has(i));button.setAttribute("aria-pressed",String(xs.has(i)));button.setAttribute("aria-label","選択肢 "+(i+1)+" の除外マークを"+(xs.has(i)?"解除":"付ける"));}}
function selectChoice(i){if(done)return;const multi=Array.isArray(current.answerIndices);if(multi){if(selectedChoice.includes(i))selectedChoice=selectedChoice.filter(x=>x!==i);else if(selectedChoice.length<current.answerIndices.length)selectedChoice.push(i)}else selectedChoice=[i];document.querySelectorAll(".choice").forEach(b=>b.classList.toggle("selected",selectedChoice.includes(+b.dataset.i)));const required=multi?current.answerIndices.length:1;$("selectionHint").textContent=multi?"正しいと思うものを"+required+"つ選択してください（"+selectedChoice.length+" / "+required+"）":"選択肢を1つ選んでください";$("next").disabled=selectedChoice.length!==required}
function submitAnswer(){const answers=Array.isArray(current.answerIndices)?current.answerIndices:[current.answerIndex];if(done||selectedChoice.length!==answers.length)return;done=true;const chosen=[...selectedChoice].sort((a,b)=>a-b),correct=[...answers].sort((a,b)=>a-b);const ok=chosen.length===correct.length&&chosen.every((v,i)=>v===correct[i]);let r=rec(current.id);r.attempts++;if(ok){r.correct++;sessionOK++}else r.wrong++;saved[current.id]=r;save();document.querySelectorAll(".choice").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(answers.includes(i))b.classList.add("correct");if(selectedChoice.includes(i)&&!answers.includes(i))b.classList.add("wrong")});$("explain").innerHTML='<div class="result '+(ok?"good":"bad")+'">'+(ok?"✓ 正解！":"✕ 不正解")+'</div><div>正解は <strong>'+answers.map(x=>x+1).sort((a,b)=>a-b).join("・")+'番</strong> です。</div><h2>解説</h2>'+esc(current.explanation);$("explain").classList.add("show");$("next").textContent="次の問題へ ➔";$("next").disabled=false;stats()}
function next(){if(!done)return;pos++;draw();window.scrollTo({top:0,behavior:"smooth"})}
$("mode").onchange=start;$("scope").onchange=start;$("choiceOrder").onchange=()=>{pos=0;sessionOK=0;draw()};$("resetStudy").onclick=()=>resetProgress(false);$("resetAll").onclick=()=>resetProgress(true);document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(!done&&current&&/^[1-8]$/.test(e.key)&&+e.key<=current.choices.length)selectChoice(+e.key-1);else if(!done&&current&&e.key==="Enter"&&selectedChoice.length===(Array.isArray(current.answerIndices)?current.answerIndices.length:1))submitAnswer();else if(done&&(e.key==="Enter"||e.key===" "))next()});start();
</script></body></html>

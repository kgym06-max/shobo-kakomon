{"id":1,"category":"消防関係法令（共通）","question":"次の記述のうち、消防法令上、誤っているものはどれか。","choices":["消防用設備等とは、消防の用に供する設備、消防用水及び消火活動上必要な施設をいう。","防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。","消防用設備等を設置することが義務付けられている防火対象物は、病院、旅館等不特定多数の者が出入りする防火対象物に限られる。","戸建て一般住宅については、消防用設備等の設置義務はない。"],"answerIndex":2,"explanation":"【正解：3】\n1. 法第17条1項。\n2. 法第2条4項。\n3. 消防用設備等の設置が義務付けられている防火対象物は、令別表第1（17P参照）に掲げる用途の防火対象物である。病院、旅館等不特定多数の者が出入りする防火対象物に限られているわけではない。\n4. 戸建て一般住宅については、「消防用設備等」の設置義務はないが、法第9条の2により、「住宅用防災機器」の設置義務がある。"},
{"id":2,"category":"消防関係法令（共通）","question":"消防用設備等に関する記述として、消防法令上、正しいものは次のうちどれか。","choices":["消防用設備等を設置することが義務付けられている防火対象物は、学校、病院及び旅館等の不特定多数の者が出入りする防火対象物に限られている。","戸建て一般住宅についても、一定の規模を超える場合、消防用設備等を設置しなければならない。","消防用設備等とは、消防の用に供する設備及び消火活動上必要な施設をいう。","政令で定める防火対象物の関係者は、政令で定める技術上の基準に従って消防用設備等を設置し、及び維持する義務がある。"],"answerIndex":3,"explanation":"【正解：4】\n1. 消防用設備等の設置が義務付けられている防火対象物は、令別表第1（17P参照）に掲げる用途の防火対象物である。\n2. 戸建て一般住宅は、その規模に関わらず「消防用設備等」を設置しなくてよい。ただし、「住宅用防災機器」を設置しなければならない。\n3. 消防用設備等とは、消防の用に供する設備、「消防用水」及び消火活動上必要な施設をいう。「消防用水」が抜けている。\n4. 法第17条1項。"}
,
{"id":3,"category":"消防関係法令（共通）","question":"【１】消防法令に定める「関係者」として、誤っているものは次のうちどれか。","choices":["防火対象物の管理者","消防対象物の所有者","防火対象物の防火管理者","消防対象物の占有者"],"answerIndex":2,"explanation":"正解：3"},
{"id":4,"category":"消防関係法令（共通）","question":"【２】無窓階の説明として、消防法令上、正しいものは次のうちどれか。[編]","choices":["建築物の外壁に窓を有しない階","採光上又は排煙上有効な開口部を有しない階","排煙上又は消火活動上有効な窓が一定基準に達しない階","消火活動上有効な窓が一定基準に達しない階","消火活動上有効な窓を有しない階","避難上又は排煙上有効な開口部が一定基準に達しない階","窓を有しない階","避難上又は消火活動上有効な開口部を有しない階"],"answerIndex":7,"explanation":"正解：8"},
{"id":5,"category":"消防関係法令（共通）","question":"【３】避難上又は消火活動上有効な開口部を有しない階（以下「無窓階」という。）と当該開口部の基準において、消防法令上、誤っているものは次のうちどれか。[★]","choices":["床面から当該開口部の下端までの高さが1.2ｍ以内であること。","当該開口部は、格子その他の内部から容易に避難することを妨げる構造を有しないものであり、かつ、外部から開放し、容易に破壊することにより進入できるものであること。","10階以下の防火対象物にあっては、当該開口部は、道又は道に通ずる幅員１ｍ以上の通路その他の空地に面したものであること。","10階以下の防火対象物にあっては、無窓階とは、直径50cm以上の円が内接することができる開口部の面積の合計が、当該階の床面積の30分の１を超える階以外の階をいう。"],"answerIndex":3,"explanation":"【正解：4】\nこの問題は、設問の指示部分で「ただし書き」が追加されている可能性がある（編集部）。\n4. 設問の内容は、11階以上の防火対象物を対象とした無窓階の定義である。"},
{"id":6,"category":"消防関係法令（共通）","question":"【４】規則に定める、避難上又は消火活動上有効な開口部を有しない階（以下「無窓階」という。）と当該開口部の基準として、正しいものは次のうちどれか。","choices":["11階以上の階の当該開口部は、道又は道に通ずる幅員１ｍ以上の通路その他の空地に面したものであること。","高さ31ｍを超える階にあっては、直径50cm以上の円が内接することができる開口部の面積の合計が、当該階の床面積の30分の１を超える階以外の階をいう。","当該開口部は、格子その他の内部から容易に避難することを妨げる構造を有しないものであり、かつ、外部から開放し、又は容易に破壊することにより進入できるものであること。","床面から当該開口部の下端までの高さは、1.5ｍ以内であること。"],"answerIndex":2,"explanation":"【正解：3】\n1. 「10階以下の階」の当該開口部は、道又は道に通ずる幅員１ｍ以上の通路その他の空地に面したものであること。\n2. 「11階以上の階」にあっては、直径50cm以上の円が内接することができる開口部の面積の合計が当該階の床面積の30分の１を超える階（普通階）以外の階を無窓階という。\n4. 床面から当該開口部の下端までの高さは、「1.2ｍ以内」であること。"},
{"id":7,"category":"消防関係法令（共通）","question":"【５】消防法令に定められている用語の定義として、誤っているものを３つ選びなさい。[編]","choices":["防火対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物又は物件をいう。","消防対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物若しくはこれらに属する物をいう。","関係者とは、防火対象物又は消防対象物の所有者、管理者又は占有者をいう。","関係のある場所とは、防火対象物又は消防対象物のある場所をいう。","危険物とは、消防法別表第１の品名欄に掲げる物品で、同表に定める区分に応じ同表の性質欄に掲げる性状を有するものをいう。","舟車とは、船舶安全法第２条１項の規定を適用しない船舶、端舟、はしけ、被曳船その他の舟をいう。","複合用途防火対象物とは、防火対象物で政令で定める２以上の用途に供されるものをいう。"],"answerIndices":[0,1,5],"explanation":"【正解：1・2・6】\n1. 設問の内容は消防対象物。\n2. 設問の内容は防火対象物。\n6. 舟車とは、船舶安全法第２条１項の規定を適用しない船舶、端舟、はしけ、被曳船その他の舟「及び車両」をいう。"},
{"id":8,"category":"消防関係法令（共通）｜設置維持命令","question":"【１】消防用設備等の設置維持命令に関する記述について、文中の（ ）に当てはまる語句の組合せとして、消防法令上、正しいものは次のうちどれか。\n「（ア）は、防火対象物における消防用設備等が（イ）に従って設置され、又は維持されていないと認めるときは、当該防火対象物の関係者で（ウ）に対し、（イ）に従ってこれを設置すべきこと、又はその維持のため、必要な措置をなすべきことを命ずることができる。」\n（ア）        （イ）        （ウ）","choices":["消防長又は消防署長／設備等技術基準／権原を有する者","都道府県知事／設備等設置維持計画／防火管理者","消防長又は消防署長／設備等設置維持計画／権原を有する者","都道府県知事／設備等技術基準／防火管理者"],"answerIndex":0,"explanation":"【正解：1】"},
{"id":9,"category":"消防関係法令（共通）｜設置維持命令","question":"【２】消防用設備等が技術上の基準に適合していない場合、必要な措置を行うよう命令を受ける者として、消防法令上、正しいものは次のうちどれか。","choices":["防火対象物の関係者で権原を有する者","防火対象物の占有者","防火対象物の消防用設備等を工事した消防設備士","防火対象物の消防用設備等を点検した消防設備士"],"answerIndex":0,"explanation":"【正解：1】\n命令を受けるのは、防火対象物の関係者で権原を有する者である。防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。"},
{"id":10,"category":"消防関係法令（共通）｜設置維持命令","question":"【３】消防用設備等の設置及び維持に関する命令についての記述として、消防法令上、誤っているものは次のうちどれか。","choices":["命令は任意に設置した消防用設備等までは及ばない。","消防用設備等の設置義務がある防火対象物に消防用設備等の一部が設置されていない場合であっても命令の対象となる。","命令を発することができる者は、消防長又は消防署長である。","命令の相手方は、防火対象物の関係者であれば当該消防用設備等について権原を有しなくてもよい。"],"answerIndex":3,"explanation":"【正解：4】\n1. 法令では、「第17条１項の防火対象物における消防用設備等…」としているため、消防法に従って設置された消防用設備等が設置命令と維持命令の対象となる。\n4. 防火対象物の関係者で、消防用設備等について権原を有する者でなければならない。"},
{"id":11,"category":"消防関係法令（共通）｜設置維持命令","question":"【４】消防用設備等の設置又は維持に関する命令について、消防法令上、正しいものを３つ選びなさい。[★][編][改]","choices":["消防長又は消防署長は、消防用設備等が技術基準に従って維持されていない場合、防火対象物の関係者で権原を有する者に対して、必要な措置をとることを命ずることができる。","消防長又は消防署長は、消防用設備等が技術基準に従って設置されていない場合、工事に従事した消防設備士に対して、工事の手直しを命ずることができる。","設置の命令に違反して消防用設備等を設置しなかった者は、罰金又は拘留に処せられる。","設置の命令に違反して消防用設備等を設置しなかった者は、拘禁刑又は罰金に処せられる。","維持の命令に違反して消防用設備等の維持のため必要な措置をとらなかった者は、拘禁刑又は罰金に処せられる。","維持の命令に違反して消防用設備等の維持のため必要な措置をとらなかった者は、罰金又は拘留に処せられる。"],"answerIndices":[0,3,5],"explanation":"【正解：1・4・6】\n2. 設置命令及び維持命令ともに、命令を受けるのは、防火対象物の関係者で権原を有する者である。\n3. 設置の命令違反は「罰金又は拘留」⇒「拘禁刑又は罰金」。\n5. 維持の命令違反は「拘禁刑又は罰金」⇒「罰金又は拘留」。\n※法改正により、設置命令違反の「懲役又は罰金」が「拘禁刑又は罰金」に改正された（編集部）。"},
{"id":12,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【１】消防設備士免状の交付を受けていない者でも、工事又は整備を行うことができる消防用設備等の部分について、消防法令上、正しいものは次のうちどれか。","choices":["泡消火設備の配管部分","ハロゲン化物消火設備の配管部分","粉末消火設備の配管部分","スプリンクラー設備の配管部分"],"answerIndex":3,"explanation":"【正解：4】\n1〜3. 泡消火設備・ハロゲン化物消火設備・粉末消火設備の配管部分は、消防設備士でなければ行ってはならない工事又は整備に含まれている。\n4. スプリンクラー設備の配管部分は、消防設備士でなければ行ってはならない工事又は整備の対象から除外されている。配管は、スプリンクラー設備の他、屋内消火栓設備・水噴霧消火設備・屋外消火栓設備についても対象から除外されている。"},
{"id":13,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【２】消防設備士でなければ工事又は整備を行うことができない消防用設備等の部分について、消防法令上、正しいものは次のうちどれか。","choices":["スプリンクラー設備の配管部分","粉末消火設備の貯蔵容器部分","屋内消火栓設備の水源部分","泡消火設備の電源部分"],"answerIndex":1,"explanation":"【正解：2】\n1＆3. スプリンクラー設備、屋内消火栓設備の〔電源・水源・配管〕部分は、消防設備士でなければ行ってはならない工事又は整備の対象から除外されている。\n4. 泡消火設備の〔電源〕部分は、消防設備士でなければ行ってはならない工事又は整備の対象から除外されている。"},
{"id":14,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【３】消防設備士でなければ行うことができない消防用設備等の工事又は整備の範囲として、消防法令上、誤っているものは次のうちどれか。","choices":["泡消火設備の配管の接続工事","自動火災報知設備の感知器の設置工事","消火器の消火薬剤の詰替え","屋内消火栓設備のネジ類等部品の交換"],"answerIndex":3,"explanation":"【正解：4】\n4. 屋内消火栓設備のネジ類等部品の交換は、消防設備士でなくても行える整備の範囲に該当する。"},
{"id":15,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【４】工事整備対象設備等着工届出書による届出が必要となる消防用設備等として、消防法令上、正しいものは次のうちどれか。","choices":["誘導灯","消防機関へ通報する火災報知設備","非常警報設備","漏電火災警報器"],"answerIndex":1,"explanation":"【正解：2】\n法第17条の14（「11. 工事整備対象設備等着工届」58P参照）では、法第17条の5の規定に基づく工事をしようとするときは、工事整備対象設備等着工届出書を届け出るよう規定している。従って、「法第17条の5の規定に基づく工事」であるかどうかが、この問題のポイントとなる。\n消防設備士でなければ行ってはならない工事又は整備の一覧によると、「消防機関へ通報する火災報知設備」は含まれている。しかし、誘導灯と非常警報設備は一覧に含まれていない。また、漏電火災警報器は一覧に含まれているが、設置工事ではなく整備のみが対象としてあり、着工届出書による届出は必要ない。"},
{"id":16,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【５】消防設備士でなければ工事又は整備を行うことができない消防用設備等の組合せとして、消防法令上、正しいものを２つ選びなさい。[★][編]","choices":["屋内消火栓設備、不活性ガス消火設備、スプリンクラー設備、動力消防ポンプ設備","泡消火設備、粉末消火設備、パッケージ型消火設備","泡消火設備、不活性ガス消火設備、粉末消火設備","自動火災報知設備、漏電火災警報器、放送設備","消火器、救助袋、すべり台","消火器、すべり台、緩降機"],"answerIndices":[1,2],"explanation":"【正解：2・3】\n1. 動力消防ポンプ設備は、消防設備士でなければ工事又は整備を行ってはならない消防用設備等の対象外である。\n2. パッケージ型消火設備は、告示により対象とする消防用設備等に含まれている。\n4. 放送設備は対象外である。\n5＆6. すべり台は対象外である。"},
{"id":17,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【６】消防設備士でなくても行うことができる消防用設備等の工事又は整備の範囲として、消防法令上、誤っているものは次のうちどれか。","choices":["給水装置工事主任技術者であるＡは、スプリンクラー設備の水源に水を補給するための給水管を交換した。","電気主任技術者であるＢは、自動火災報知設備の電源表示ランプを交換した。","電気工事士であるＣは、屋内消火栓の表示灯が消えていたので、表示灯配線の異常の有無について検査して、電球を取り替えた。","水道工事業者であるＤは、屋外消火栓の水漏れ補修を頼まれ、水漏れの原因となった屋外消火栓開閉弁を新品と交換した。"],"answerIndex":3,"explanation":"【正解：4】\n1. 法第17条の5の規定に基づく工事に、「配管」は除く、としている。\n2＆3. 消防設備士でなくとも行える軽微な整備として、「表示灯の交換」「その他これらに類するもの」がある。電源表示ランプの交換や表示灯の電球の取り替えは、軽微な整備に該当するものと判断する。"},
{"id":18,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【７】消防設備士でなくても行える消防用設備等の工事又は整備の範囲として、消防法令上、誤っているものは次のうちどれか。","choices":["水道工事業者であるＡは、屋内消火栓の水漏れの補修を頼まれ、屋内消火栓開閉弁を新品のものに取り替えた。","電気工事士であるＢは、定期点検中、屋内消火栓の表示灯が消えているのを見つけ、表示灯配線を検査して異常がないことを確認してから、電球を取り替えた。","防火管理者であるＣは、定期点検中、屋外消火栓箱の扉ががたついているのを見つけ、取り外して修理した後取りつけた。","自衛消防隊長であるＤは、消火訓練中、屋外消火栓ホースが傷んでいるのに気づき、訓練終了後ホースを取り替えたが、そのときノズルも交換した。"],"answerIndex":0,"explanation":"【正解：1】\n2〜4. 屋内消火栓設備の表示灯の交換、消火栓箱の補修及び消火栓ホース・ノズルの交換は、消防設備士でなくても行える整備の範囲に含まれている。"},
{"id":19,"category":"消防関係法令（共通）｜工事・整備の範囲、着工届","question":"【８】消防設備士でなければ工事又は整備を行うことができない消防用設備等として、消防法令上、誤っているものは次のうちどれか。","choices":["スプリンクラー設備","泡消火設備","非常警報設備","漏電火災警報器"],"answerIndex":2,"explanation":"【正解：3】\n3. 非常警報設備は、非常ベル、自動式サイレン、放送設備が該当する。自動火災報知設備とともに警報設備に含まれる。しかし、消防設備士でなければ工事又は整備を行うことができない消防用設備等には該当しない。"},
{"id":20,"category":"消防関係法令（共通）｜付加条例","question":"【１】法令上、その地方の気候又は風土の特殊性により、法に定める消防用設備等の技術上の基準に関する政令又はこれに基づく命令の規定のみによっては防火の目的を充分に達し難いと認めるときは、同項の消防用設備等の技術上の基準に関して、当該政令又はこれに基づく命令の規定と異なる規定を設けることができる。この基準を定めるのは次のうちどれか。","choices":["消防庁長官の定める基準","市町村条例","都道府県知事の定める基準","市町村規則"],"answerIndex":1,"explanation":"【正解：2】"},
{"id":21,"category":"消防関係法令（共通）｜付加条例","question":"【２】消防法第17条第２項に規定されている付加条例について、最も適切なものは次のうちどれか。","choices":["市町村の付加条例によって、消防用設備等の設置及び維持に関する技術上の基準について、政令で定める基準を強化することができる。","市町村の付加条例によって、消防用設備等の設置及び維持に関する技術上の基準について、政令で定める基準を緩和することができる。","市町村の付加条例によって、消防法施行令別表第１の防火対象物以外の防火対象物に対して消防用設備等の設置を義務付けることができる。","市町村の付加条例によって、政令で定める消防用設備等の一部を設置しなくてもよいという特例基準を定めることができる。"],"answerIndex":0,"explanation":"【正解：1】\n1. 消防用設備等の技術上の基準について、市町村は政令又はこれに基づく命令の規定と異なる規定を条例として追加することができる。この結果、消防用設備等の技術上の基準はより厳しい内容となる。条例では法令で定める消防用設備等の技術上の基準そのものを緩和することはできない。"},
{"id":22,"category":"消防関係法令（共通）｜基準の特例","question":"【１】消防用設備等の設置に際し、政令に定める基準によらなくてもよいものに関する記述について、文中の（ ）に当てはまる語句として、消防法令上、正しいものは次のうちどれか。[★]\n「第２章第３節に定める消防用設備等の設置及び維持の技術上の基準の規定は、消防用設備等について、（ ）が、防火対象物の位置、構造又は設備の状況から判断して、この規定による消防用設備等の基準によらなくとも、火災の発生又は延焼のおそれが著しく少なく、かつ、火災等の災害による被害を最少限度に止めることができると認めるときにおいては、適用しない。」","choices":["総務大臣","都道府県知事","市町村長","消防長又は消防署長"],"answerIndex":3,"explanation":"【正解：4】"},
{"id":23,"category":"消防関係法令（共通）｜消防設備士の種類と業務範囲","question":"【１】消防設備士が行うことができる工事又は整備について、消防法令上、誤っているものは次のうちどれか。[★]","choices":["甲種特類消防設備士免状の交付を受けている者は、消防用設備等のすべて及び特殊消防用設備等について、整備を行うことができる。","甲種第４類消防設備士免状の交付を受けている者は、危険物製造所等に設置する自動的に作動する火災報知設備の工事を行うことができる。","乙種第１類消防設備士免状の交付を受けている者は、屋外消火栓設備の開閉弁の整備を行うことができる。","乙種第５類消防設備士免状の交付を受けている者は、緩降機本体及びその取付け具の整備を行うことができる。"],"answerIndex":0,"explanation":"【正解：1】\n1. 甲種特類消防設備士免状の交付を受けている者は、特殊消防用設備等について、工事又は整備を行うことができる。"},
{"id":24,"category":"消防関係法令（共通）｜消防設備士の種類と業務範囲","question":"【２】消防設備士が行うことができる工事又は整備について、消防法令上、誤っているものは次のうちどれか。","choices":["甲種第１類の消防設備士は、スプリンクラー設備の整備を行うことができる。","甲種第２類の消防設備士は、泡消火設備の工事を行うことができる。","甲種第４類の消防設備士は、漏電火災警報器の整備を行うことができる。","乙種第３類の消防設備士は、粉末消火設備の整備を行うことができる。"],"answerIndex":2,"explanation":"【正解：3】\n3. 漏電火災警報器の整備を行うためには、乙種第７類の消防設備士資格が必要となる。"},
{"id":25,"category":"消防関係法令（共通）｜消防設備士の種類と業務範囲","question":"【３】消防設備士が行う工事又は整備について、消防法令上、誤っているものは次のうちどれか。","choices":["甲種第５類の消防設備士免状の交付を受けている者は、緩降機及び救助袋の工事を行うことができる。","乙種第４類の消防設備士免状の交付を受けている者は、ガス漏れ火災警報設備の整備を行うことができる。","乙種第２類の消防設備士免状の交付を受けている者は、泡消火設備の整備を行うことができる。","乙種第１類の消防設備士免状の交付を受けている者は、水噴霧消火設備の工事を行うことができる。"],"answerIndex":3,"explanation":"【正解：4】\n4. 「水噴霧消火設備の工事」⇒「水噴霧消火設備の整備」。"},
{"id":26,"category":"消防関係法令（共通）｜消防設備士の種類と業務範囲","question":"【４】消防設備士が行う工事又は整備について、消防法令上、正しいものは次のうちどれか。","choices":["甲種第１類の消防設備士は、泡消火設備の整備を行うことができる。","乙種第５類の消防設備士は、金属製避難はしごの設置工事を行うことができる。","甲種第４類の消防設備士は、自動火災報知設備の設置工事を行うことができる。","乙種第６類の消防設備士は、漏電火災警報器の整備を行うことができる。"],"answerIndex":2,"explanation":"【正解：3】\n1. 甲種第１類の消防設備士は、屋内消火栓設備、スプリンクラー設備、水噴霧消火設備又は屋外消火栓設備などの工事又は整備を行うことができる。泡消火設備の整備を行うためには、甲種第２類又は乙種第２類の消防設備士資格が必要となる。\n2. 乙種第５類の消防設備士は、金属製避難はしごの整備を行うことができる。設置工事を行うためには、甲種第５類の消防設備士資格が必要となる。\n4. 漏電火災警報器の整備を行うためには、乙種第７類の消防設備士資格が必要となる。"},
{"id":27,"category":"消防関係法令（共通）｜消防設備士の種類と業務範囲","question":"【５】消防設備士に関する記述として、消防法令上、誤っているものは次のうちどれか。","choices":["消防用設備等の移設には、乙種消防設備士の資格を必要とする場合がある。","消防用設備等の増設には、甲種消防設備士の資格を必要とする場合がある。","消防用設備等の不良箇所が指定された場合の不良機器の調整、又は部品交換には、乙種消防設備士の資格を必要とする場合がある。","消防用設備等の新設には、甲種消防設備士の資格を必要とする場合がある。"],"answerIndex":0,"explanation":"【正解：1】\n1. 消防用設備等の移設は「工事」に該当するため、甲種消防設備士の資格が必要である。"},
{"id":28,"category":"消防関係法令（共通）｜消防設備士の種類と業務範囲","question":"【６】Ａ、Ｂ、Ｃ、Ｄの４人は、それぞれ消防用設備等の工事又は整備を行ったが、消防法令上、違反とならないものは次のうちどれか。[★]","choices":["共同住宅の所有者であるＡは、この建物が自動火災報知設備の設置の義務があるため、消防設備士の免状の交付を受けていないが、電気工事士の資格を持っているため、自分でその建物に自動火災報知設備の設置工事を行った。","危険物の関係施設の工事を業としているＢは、得意先から危険物の製造所に義務設置の第３種の消火設備の設置工事を依頼された。危険物の製造所が消防法第17条第１項の適用を受ける対象物ではないと考え、設置工事を行った。","甲種第２類の消防設備士の免状の交付を受けているＣは、消火器の販売に従事し、消火薬剤詰め替え等の整備を行った。","乙種第３類の消防設備士の免状の交付を受けているＤは、自分が経営している工場に設置されている粉末消火設備の整備を行った。"],"answerIndex":3,"explanation":"【正解：4】\n1. 自動火災報知設備の設置工事は、甲種第４類の消防設備士の免状の交付を受けている者が行う。\n2. 危険物の製造所に行う第３種の消火設備（下表参照）の設置工事は、甲種第１類、甲種第２類又は甲種第３類の消防設備士の免状の交付を受けている者が行う。\n3. 消火器の消火薬剤詰め替え等の整備は、乙種第６類の消防設備士の免状の交付を受けている者が行う。\n4. 粉末消火設備の整備は、甲種第３類または乙種第３類の消防設備士の免状の交付を受けている者が行う。\n\n〔消火設備の区分〕（危険物の規制に関する政令 別表第５より抜粋）\n第１種：屋内消火栓設備・屋外消火栓設備（第１類）\n第２種：スプリンクラー設備（第１類）\n第３種：水蒸気消火設備・水噴霧消火設備（第１類）／泡消火設備（第２類）／不活性ガス消火設備・ハロゲン化物消火設備・粉末消火設備（第３類）\n第４種：大型消火器（第６類）\n第５種：小型消火器（第６類）／水バケツ・水槽、乾燥砂・膨張ひる石・膨張真珠岩\n※（ ）内はその消火設備に対応する消防設備士免状の種類を示す。"},
{"id":29,"category":"消防関係法令（共通）｜用途変更と技術上の基準","question":"【１】防火対象物の用途が変更された場合の消防用設備等の技術上の基準の適用について、消防法令上、正しいものは次のうちどれか。[★]","choices":["防火対象物の用途が変更された場合は、変更後の用途に適合する消防用設備等を設置しなければならない。","変更後の用途が特定防火対象物に該当しなければ、すべての消防用設備等を変更しなくてよい。","変更後の用途が特定防火対象物に該当する場合は、変更後の用途区分に適合する消防用設備等を設置しなければならない。","用途変更前に設置された消防用設備等が違反していた場合は、変更前の基準に適合するよう措置しなければならない。"],"answerIndex":2,"explanation":"【正解：3】\n1. 特例が設けられているため、変更前の用途に適合する消防用設備等で良い場合がある。\n2. 変更後の用途が特定防火対象物に該当しなくても、変更後の基準に適合するよう変更しなければならない場合がある。\n4. この場合、用途変更後の基準に適合するよう措置しなければならない。"},
{"id":30,"category":"消防関係法令（共通）｜用途変更と技術上の基準","question":"【２】防火対象物の用途変更と消防用設備等（消火器、避難器具その他政令で定めるものを除く。）の技術基準の関係について、消防法令上、正しいものは次のうちどれか。","choices":["消防用設備等が変更前の用途に係る技術基準に違反していた場合、変更後の用途に係る技術基準に従って設置しなければならない。","用途が変更された場合、いかなる用途の防火対象物であっても変更後の用途に係る技術基準に従い設置しなければならない。","用途が変更されて特定防火対象物になった場合、変更前の用途に係る技術基準に従って設置されていれば、変更後の用途基準に従って設置する必要はない。","用途が変更された後に、主要構造部である壁について過半の修繕を施した場合、変更前の用途に係る技術基準に従って設置されれば、変更後の用途に係る技術基準に従って設置する必要はない。"],"answerIndex":0,"explanation":"【正解：1】\n1. 特例が適用されない例の①に該当。\n2. 特例が設けられているため、変更前の用途に適合する消防用設備等で良い場合がある。\n3. 変更後の用途基準に従って設置する。特例が適用されない例の④に該当。\n4. 変更後の用途基準に従って設置する。特例が適用されない例の②に該当。"},
{"id":31,"category":"消防関係法令（共通）｜用途変更と技術上の基準","question":"【３】防火対象物の用途が変更された場合の消防用設備等の技術上の基準の適用について、消防法令上、誤っているものは次のうちどれか。[編]","choices":["原則として、用途変更前に設置された消防用設備等はそのままにしておいてよいが、その後、一定規模以上の増改築工事を行う場合は、変更後の用途区分に適合する消防用設備等を設置しなければならない。","用途変更前に設置された消防用設備等が用途変更前の基準に違反していた場合は、用途変更後の基準に適合する消防用設備等を設置しなければならない。","変更後の用途が特定防火対象物に該当する場合は、変更後の用途区分に適合する消防用設備等を設置しなければならない。","用途変更後、設置義務のなくなった消防用設備等については、撤去するなど確実に機能を停止させなければならない。","用途変更前に設置された適法な消防用設備等については、法令に定める場合を除き、変更する必要はない。"],"answerIndex":3,"explanation":"【正解：4】\n1. 特例が適用されない例の②に該当。\n2. 特例が適用されない例の①に該当。\n3. 特例が適用されない例の④に該当。\n4. 不要となった消防用設備等の措置については、消防法では特に規定されていない。ただし、廃棄物処理法やリサイクル法の適用を受ける。\n5. 特例が適用される内容である。"},
{"id":32,"category":"消防関係法令（共通）｜消防用設備等の点検及び報告","question":"【８】消防法第17条の３の３に基づく消防用設備等の点検及び報告について、消防法令上、誤っているものを３つ選びなさい。ただし、規則第31条の６第４項の規定に基づく、消防庁長官が定める事由により点検等の期間を延長する措置は考慮しないものとする。[★][編]","choices":["特定防火対象物の関係者は、点検を行った結果を１年に１回、都道府県知事に報告しなければならない。","政令別表第１（20）項に掲げる舟車は、防火対象物であるが点検を行う義務はない。","防火対象物の関係者は、点検を行った結果を維持台帳に記録し、防火対象物の区分によって定められた期間ごとに、消防長又は消防署長に報告しなければならない。","防火対象物の関係者が、自ら消防用設備等の定期点検を行う防火対象物もある。","延べ面積が1,000㎡以上の特定防火対象物の関係者は、消防設備士等の有資格者に消防用設備等の点検をさせなければならない。","延べ面積が1,000㎡以上の特定防火対象物の消防用設備等の定期点検は、消防設備士の免状の交付を受けている者のみができる。","特定防火対象物以外の防火対象物の関係者は、延べ面積が300㎡以上のもののうち消防長又は消防署長が火災予防上必要があると認めて指定するものは、消防設備士等の有資格者に点検させなければならない。"],"answerIndices":[0,5,6],"explanation":"【正解：1・6・7】\n1. 報告先は「都道府県知事」ではなく「消防長又は消防署長」。\n6. 消防設備士のほか、消防設備点検資格者も定期点検を行うことができる。\n7.「延べ面積が300㎡以上」ではなく「延べ面積が1,000㎡以上」。"},
{"id":33,"category":"消防関係法令（共通）｜消防用設備等の点検及び報告","question":"【９】消防用設備等の定期点検及び報告に関する記述について、消防法令上、正しいものを２つ選びなさい。ただし、総務省令で定める舟車を除く。また、規則第31条の６第４項の規定に基づく消防庁長官の定める事由により、点検等の期間を延長する措置は考慮しないものとする。[★][編]","choices":["すべての防火対象物に設置された消防用設備等の点検は、消防設備士又は消防設備点検資格者でなければ行うことはできない。","消防法第17条に基づいて設置された消防用設備等は、定期に点検をしなければならない。","消防設備士又は消防設備点検資格者は、点検した結果について、消防長又は消防署長に報告しなければならない。","特定防火対象物の消防用設備等については、すべて定期に点検し、その結果を都道府県知事に報告しなければならない。","定期点検の結果について報告をせず、又は虚偽の報告をした者は、30万円以下の罰金又は拘留に処せられることがある。"],"answerIndices":[1,4],"explanation":"【正解：2・5】\n1. 点検は、有資格者以外でも行うことができるものがある。\n3. 報告義務者は点検を行った消防設備士等ではなく、防火対象物の関係者。\n4. 報告先は都道府県知事ではなく、消防長又は消防署長。"},
{"id":34,"category":"消防関係法令（共通）｜消防用設備等の点検及び報告","question":"【10】消防用設備等の定期点検を消防設備士又は消防設備点検資格者に点検させなければならない防火対象物として、消防法令上、正しいものは次のうちどれか。ただし、すべて耐火構造、地階はなく階数３、延べ面積は300㎡とし、避難階は１階とする。また、いずれの防火対象物も、屋内階段は規則に定める避難上有効な構造を有しないものとし、消防用設備等又は特殊消防用設備等の防火安全性能を確保するために、消防設備士等による点検が特に必要であるものと規則に定める防火対象物には該当しないものとする。","choices":["避難階又は地上に直通する屋内階段が一で、１階及び２階がパチンコ店、３階が美容室の複合用途防火対象物","避難階又は地上に直通する屋外階段が一で、１階及び２階が学習塾、３階が喫茶店の複合用途防火対象物","避難階又は地上に直通する屋内階段が一のカラオケ店","避難階又は地上に直通する屋外階段が一のビジネスホテル"],"answerIndex":2,"explanation":"【正解：3】\n1. ３階の美容室は令別表第１（15）に該当し、特定防火対象物ではないため特定一階段等防火対象物とはならない。\n2＆4. 屋外階段であるため該当しない。\n※「避難上有効な構造を有する階段」とは、避難階段又は特別避難階段をいう。"},
{"id":35,"category":"消防関係法令（共通）｜消防用設備等の点検及び報告","question":"【11】消防用設備等又は特殊消防用設備等の点検及び報告の期間に関する記述について、文中の（ ）に当てはまる語句として、消防法令上、正しいものは次のうちどれか。ただし、（ ）には同じ語句が入るものとする。\n「新型インフルエンザ等その他の（ ）が定める事由により、これらの項に規定する期間ごとに法第17条の３の３の規定による点検を行い、又はその結果を報告することが困難であるときは、（ ）が当該事由を勘案して定める期間ごとに当該点検を行い、又はその結果を報告するものとする。」","choices":["消防長又は消防署長","消防庁長官","総務大臣","都道府県知事"],"answerIndex":1,"explanation":"【正解：2】"},
{"id":36,"category":"消防関係法令（共通）｜消防用設備等の点検及び報告","question":"【12】消防用設備等の点検の結果について、消防法令上、消防長又は消防署長への報告期間が１年に１回と定められているものは次のうちどれか。ただし、規則第31条の６第４項の規定に基づく、消防庁長官が定める事由により、点検等の期間を延長する措置は考慮しないものとする。","choices":["防火構造で、延べ面積が300㎡の飲食店","準耐火構造で、延べ面積が500㎡の寺院","耐火構造で、延べ面積が1,000㎡の寄宿舎","耐火構造で、延べ面積が1,500㎡の博物館"],"answerIndex":0,"explanation":"【正解：1】\n1. 特定防火対象物が１年に１回の報告となる。\n2〜4. 特定防火対象物以外の防火対象物のため、３年に１回の報告となる。"},
{"id":37,"category":"消防関係法令（共通）｜防火対象物点検資格者","question":"【１】防火対象物点検資格者に関する記述について、文中の（ ）に当てはまるものとして、消防法令上、正しいものは次のうちどれか。\n「消防設備士が防火対象物点検資格者になる条件の一つとして、消防用設備等の工事、整備又は点検について（ ）年以上の実務経験が必要である。」","choices":["１","２","３","４"],"answerIndex":2,"explanation":"【正解：3】"},
{"id":38,"category":"消防関係法令（共通）｜防火対象物点検資格者","question":"【２】消防法令上、防火対象物点検資格者でなければ点検できない防火対象物は次のうちどれか。","choices":["防火対象物の管理について権原が分かれている、防火管理者を定める必要のない特定防火対象物","防火対象物の管理について権原が分かれていない、防火管理者を定める必要のある特定防火対象物以外の防火対象物","防火対象物の管理について権原が分かれている、収容人員250人の特定防火対象物に該当する複合用途防火対象物","防火対象物の管理について権原が分かれていない、収容人員450人の特定防火対象物に該当する複合用途防火対象物"],"answerIndex":3,"explanation":"【正解：4】\n防火対象物の権原を有する者は、防火対象物点検資格者に点検させなければならない。\n3. 権原が分かれている場合、それぞれの権原を有する者は点検させる必要があるが、収容人員250人の特定用途の複合用途防火対象物は300人以上ではないため該当しない。"},
{"id":39,"category":"消防関係法令（共通）｜消防用設備等の種類・定義・設置維持","question":"【１】消防法令上、一定の防火対象物の関係者は、消防用設備等を設置し、維持することが義務付けられているが、これに関する説明として、正しいものは次のうちどれか。","choices":["消防用設備等を設置することが義務付けられている防火対象物は、百貨店、病院、旅館等の不特定多数の者が出入りする防火対象物に限られる。","一戸建ての住宅についても、一定の規模を超える場合、消防用設備等を設置しなければならない。","防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。この関係者で権原を有するものが、設置し維持すべきことに対する命令に違反した場合、処罰の対象となる。","消防用設備等とは、消防の用に供する設備、消防用水及び消火活動上必要な施設をいい、水バケツはこれに含まれない。"],"answerIndex":2,"explanation":"【正解：3】\n1. 消防用設備等の設置が義務付けられている防火対象物は、令別表第１に掲げる用途の防火対象物である。不特定多数の者が出入りする防火対象物に限られない。\n2. 戸建て一般住宅は、その規模に関わらず消防用設備等を設置しなくてよい。ただし、住宅用防災機器を設置しなければならない。\n3. 消防長又は消防署長は、防火対象物の関係者で権原を有する者に対し、消防用設備等の設置維持命令を出すことができる。命令違反は処罰の対象となる。\n4. 水バケツ、水槽、乾燥砂、膨張ひる石又は膨張真珠岩は、簡易消火用具として消火設備に含まれる。"},
{"id":40,"category":"消防関係法令（共通）｜消防用設備等の種類・定義・設置維持","question":"【２】消防用設備等の設置及び維持に関する説明として、消防法令上、正しいものは次のうちどれか。[編]","choices":["消防用設備等を政令で定める技術上の基準に従って設置し、及び維持することが義務付けられているのは、防火対象物の所有者ではなく、防火管理者である。","消防用設備等とは、政令で定める消防の用に供する設備、消防用水及び消火活動上必要な施設をいう。","消防用設備等を設置することが義務付けられている防火対象物は、百貨店、病院、ホテル等の特定防火対象物に限られる。","防火対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物又は物件をいう。","市町村は、その地方の気候又は風土の特殊性により、消防用設備等の技術上の基準に関する政令またはこれに基づく命令の規定のみによっては防火の目的を十分に達し難いと認めるときは、条例で当該規定を緩和する規定を設けることができる。"],"answerIndex":1,"explanation":"【正解：2】\n1. 消防用設備等の設置・維持が義務付けられているのは、防火対象物の関係者（所有者など）であり、防火管理者ではない。\n3. 設置が義務付けられる防火対象物は、令別表第１に掲げる用途の防火対象物であり、特定防火対象物に限られない。\n4. 設問の内容は「消防対象物」の定義である。防火対象物は、建築物その他の工作物若しくはこれらに属する物をいう。\n5. 条例で当該規定を緩和する規定を設けることはできない。"},
{"id":41,"category":"消防関係法令（共通）｜消防用設備等の種類・定義・設置維持","question":"【３】消防法令に定められている用語の定義又は説明として、誤っているものを２つ答えなさい。[★][編]","choices":["消防の用に供する設備………消火設備、警報設備及び避難設備をいう。","消防の用に供する設備………消火設備、警報設備及び消火水槽をいう。","消火活動上必要な施設……排煙設備、連結散水設備及び動力消防ポンプ設備をいう。","消火活動上必要な施設……排煙設備、連結散水設備、連結送水管、非常コンセント設備及び無線通信補助設備をいう。","防火対象物の関係者………防火対象物の所有者、管理者又は占有者をいう。","複合用途防火対象物………政令で定める２以上の用途に供される防火対象物をいう。"],"answerIndices":[1,2],"explanation":"【正解：2・3】\n2. 消防の用に供する設備は、消火設備・警報設備・避難設備をいう。消火水槽は消火設備に含まれる。\n3. 動力消防ポンプ設備は、消防の用に供する設備のうち消火設備に含まれる。"},
{"id":42,"category":"消防関係法令（共通）｜消防用設備等の種類・定義・設置維持","question":"【４】消防用設備等の種類について、消防法令上、誤っているものは次のうちどれか。[★]","choices":["動力消防ポンプ設備は、スプリンクラー設備と同じく、消火設備に含まれる。","自動火災報知設備は、非常警報設備と同じく、警報設備に含まれる。","避難橋は、すべり台や誘導灯と同じく、避難設備に含まれる。","消防機関へ通報する火災報知設備は、無線通信補助設備と同じく、消火活動上必要な施設に含まれる。"],"answerIndex":3,"explanation":"【正解：4】\n3. 避難橋は、建築物相互を連結する橋状のものであり、避難設備に含まれる。\n4. 消火活動上必要な施設は、排煙設備、連結散水設備、連結送水管、非常コンセント設備及び無線通信補助設備をいう。消防機関へ通報する火災報知設備は、警報設備に含まれる。"},
{"id":43,"category":"消防関係法令（共通）｜消防用設備等の種類・定義・設置維持","question":"【５】消防用設備等の種類について、消防法令上、誤っているものは次のうちどれか。","choices":["屋内消火栓設備は、スプリンクラー設備と同じく、消火設備に含まれる。","連結送水管は、消火器と同じく、消火設備に含まれる。","避難橋は、すべり台や誘導灯と同じく、避難設備に含まれる。","漏電火災警報器は、非常警報設備と同じく、警報設備に含まれる。"],"answerIndex":1,"explanation":"【正解：2】\n2. 連結送水管は、消火活動上必要な施設に含まれる。"},
{"id":44,"category":"消防関係法令（共通）｜消防用設備等の種類・定義・設置維持","question":"【６】消防法令上、「警報設備」に含まれないものは、次のうちどれか。[★]","choices":["消防機関へ通報する火災報知設備","手動式サイレン","放送設備","無線通信補助設備"],"answerIndex":3,"explanation":"【正解：4】\n4. 無線通信補助設備は、消火活動上必要な施設に含まれる。"},
{"id":45,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【１】消防用設備等の技術上の基準に関する政令若しくはこれに基づく命令の規定が改正されたとき、改正後の規定に適合させなければならない消防用設備等として、消防法令上、正しいものは次のうちどれか。[★][編]","choices":["工場に設置されている屋内消火栓設備","展示場に設置されている自動火災報知設備","ラック式倉庫に設置されているスプリンクラー設備","図書館の蔵書室に設置されている窒素を放射する不活性ガス消火設備"],"answerIndex":1,"explanation":"【正解：2】\n展示場は令別表第１の（４）に該当し、特定防火対象物となる。特定防火対象物に設ける自動火災報知設備は従前の規定が適用されず、規定が改正されるごとに新規定に適合させなければならない。"},
{"id":46,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【２】用途が事務所である防火対象物において、消防用設備等の技術上の基準に関する政令若しくはこれに基づく命令の規定が改正されたとき、改正後の規定に適合させなければならない消防用設備等として、消防法令上、誤っているものは次のうちどれか。ただし、防火対象物の構造、用途、規模の変更等はないものとする。","choices":["消火器","避難器具","屋内消火栓設備","誘導灯"],"answerIndex":2,"explanation":"【正解：3】\n従前の規定が適用されない消防用設備等は、消火器、避難器具、誘導灯である。これらは基準改正のたびに改正後の規定に適合させる。一方、屋内消火栓設備は従前の規定が適用されるため、改正があってもそのまま使用を続けることができる。"},
{"id":47,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【３】消防用設備等の技術上の基準に関する政令若しくはこれに基づく命令の規定が改正されたとき、改正後の規定に適合させなければならない消防用設備等として、消防法令上、正しいものは次のうちどれか。ただし、防火対象物の構造、用途、規模の変更等はないものとする。","choices":["スプリンクラー設備","動力消防ポンプ設備","非常警報設備","排煙設備"],"answerIndex":2,"explanation":"【正解：3】"},
{"id":48,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【４】既存の特定防火対象物以外の防火対象物を消防用設備等（消火器、避難器具等を除く。）の技術上の基準が改正された後に増築した場合、消防用設備等を改正後の基準に適合させなければならないものとして、消防法令上、正しいものは次のうちどれか。ただし、当該消防用設備等は従前の規定に適合しているものとする。","choices":["増築部分の床面積の合計が、500㎡を超え、かつ、増築前の延べ面積の１／３以上である場合","増築部分の床面積の合計が、500㎡以上であるか、又は増築前の延べ面積の１／３以上である場合","増築部分の床面積の合計が、1,000㎡を超え、かつ、増築前の延べ面積の１／２以上である場合","増築部分の床面積の合計が、1,000㎡以上であるか、又は増築前の延べ面積の１／２以上である場合"],"answerIndex":3,"explanation":"【正解：4】"},
{"id":49,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【５】既存の防火対象物を消防用設備等の技術上の基準が改正された後に増築又は改築した場合、消防用設備等を改正後の基準に適合させなければならない増築又は改築の規模として、消防法令上、正しいものは次のうちどれか。","choices":["増築に係る当該防火対象物の部分の床面積の合計が、増築前の延べ面積の１／３となる場合","改築に係る当該防火対象物の部分の床面積の合計が、1,000㎡となる場合","増築に係る当該防火対象物の部分の床面積の合計が、500㎡となる場合","増築又は改築以前の当該防火対象物の延べ面積と、増築又は改築後の延べ面積との差が、500㎡となる場合"],"answerIndex":1,"explanation":"【正解：2】\n増築又は改築に係る当該防火対象物の部分の床面積の合計が1,000㎡以上となる場合は、増築又は改築にあわせて消防用設備等を改正後の基準に適合させなければならない。"},
{"id":50,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【６】既存の防火対象物を消防用設備等の技術上の基準が改正された後に増築、改築又は修繕若しくは模様替えをした場合、消防用設備等を改正後の基準に適合させなければならない増築、改築又は修繕若しくは模様替えに該当するものとして、消防法令上、正しいものは次のうちどれか。","choices":["延べ面積が1,000㎡の倉庫を1,200㎡に増築する。","延べ面積が1,500㎡の工場のうち500㎡を改築する。","延べ面積が2,000㎡の遊技場の主要構造部である壁を２／３にわたって模様替えする。","延べ面積が2,500㎡の劇場の主要構造部である壁を１／３にわたって修繕する。"],"answerIndex":2,"explanation":"【正解：3】\n1・2. 延べ面積の１／２以上の増改築に該当しないため、従前の規定が適用される。\n3. 改正後の基準に適合させなければならない模様替えに該当する。遊技場は特定防火対象物であるため、模様替え等にかかわらず改正後の基準に適合させなければならない。\n4. 劇場は特定防火対象物であり、基準改正のたびに適合が必要。ただし、設問の修繕は「過半の修繕又は模様替え」に該当しない。"},
{"id":51,"category":"消防関係法令（共通）｜既存防火対象物に対する適用除外","question":"【７】消防法令上、設備等技術基準の施行又は適用の際、既に存する防火対象物における消防用設備等（消火器、避難器具その他政令で定めるものを除く。）がこれらの規定に適合せず、当該規定が適用されていないとき、当該防火対象物を増築する場合、当該消防用設備等を当該規定に適合させなければならないものを３つ選びなさい。ただし、当該消防用設備等は、従前の規定に適合しているものとする。[★][編]","choices":["基準時の延べ面積が1,000㎡の工場を1,500㎡に増築するもの","基準時の延べ面積が1,600㎡の工場を2,500㎡に増築するもの","基準時の延べ面積が1,500㎡の倉庫を2,000㎡に増築するもの","基準時の延べ面積が5,000㎡の倉庫を6,000㎡に増築するもの","基準時の延べ面積が2,500㎡の図書館のうち、700㎡を改築するもの","基準時の延べ面積が2,500㎡の図書館を3,200㎡に増築するもの","基準時の延べ面積が1,500㎡の図書館を2,200㎡に増築するもの","基準時の延べ面積が3,000㎡の中学校のうち、800㎡を改築するもの","基準時の延べ面積が3,000㎡の中学校を3,800㎡に増築するもの","基準時の延べ面積が2,000㎡の事務所を2,900㎡に増築するもの"],"answerIndices":[0,1,3],"explanation":"【正解：1・2・4】\n1・2. 増築又は改築に係る部分の床面積の合計が、工事着手時における防火対象物の延べ面積の２分の１以上となるものに該当するため、改正後の基準に適合させなければならない。\n4. 増築又は改築に係る部分の床面積の合計が1,000㎡以上となる場合も、改正後の基準に適合させなければならない。"},
{"id":52,"category":"消防関係法令（共通）｜特定防火対象物","question":"【１】消防法令上、特定防火対象物に該当しないものは、次のうちどれか。[★]","choices":["小学校","物品販売店舗","旅館","公衆浴場のうち、蒸気浴場、熱気浴場その他これらに類するもの"],"answerIndex":0,"explanation":"【正解：1】\n小学校は特定防火対象物に該当しない。物品販売店舗、旅館、蒸気浴場・熱気浴場等は特定防火対象物に該当する。"},
{"id":53,"category":"消防関係法令（共通）｜特定防火対象物","question":"【２】消防法令上、特定防火対象物に該当するものは、次のうちどれか。","choices":["小学校","共同住宅","百貨店","図書館"],"answerIndex":2,"explanation":"【正解：3】\n百貨店は特定防火対象物に該当する。小学校、共同住宅、図書館は該当しない。"},
{"id":54,"category":"消防関係法令（共通）｜特定防火対象物","question":"【３】消防法令上、特定防火対象物に該当しないものは、次のうちどれか。","choices":["飲食店","映画館","テレビスタジオ","幼稚園"],"answerIndex":2,"explanation":"【正解：3】\nテレビスタジオは特定防火対象物に該当しない。飲食店、映画館、幼稚園は特定防火対象物に該当する。"},
{"id":55,"category":"消防関係法令（共通）｜特定防火対象物","question":"【４】特定防火対象物の組合せとして、消防法令上、正しいものは次のうちどれか。","choices":["劇場、小学校及び幼稚園","公会堂、飲食店及び図書館","百貨店、ナイトクラブ及び工場","旅館、病院及びダンスホール"],"answerIndex":3,"explanation":"【正解：4】\n旅館、病院及びダンスホールはいずれも特定防火対象物に該当する。"},
{"id":56,"category":"消防関係法令（共通）｜特定防火対象物","question":"【５】消防法令上、特定防火対象物に該当しないものの組合せは、次のうちどれか。","choices":["飲食店及び料理店","公会堂及び集会場","老人デイサービスセンター及び更生施設","図書館及び美術館"],"answerIndex":3,"explanation":"【正解：4】\n図書館及び美術館は特定防火対象物に該当しない。"},
{"id":57,"category":"消防関係法令（共通）｜特定防火対象物","question":"【６】消防法令上、特定防火対象物に該当するものは、次のうちどれか。","choices":["図書館と事務所からなる高層ビル","蒸気浴場、熱気浴場その他これらに類する公衆浴場","テレビスタジオが併設された映画スタジオ","冷凍倉庫を含む作業場"],"answerIndex":1,"explanation":"【正解：2】\n1. ２以上の用途に供されるため複合用途防火対象物となるが、いずれも特定用途ではないため特定防火対象物とはならない。\n4. 冷凍倉庫を含む作業場については、法令での明確な規定はなく、市町村条例などにより用途が定められる。"},
{"id":58,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【１】消防用設備等を設置する場合の防火対象物の基準について、消防法令上、正しいものは次のうちどれか。[★]","choices":["防火対象物が開口部のない耐火構造の床又は壁で区画されているときは、それぞれ別の防火対象物とみなされる。","同一敷地内にある２以上の防火対象物は、原則として一の防火対象物とみなされる。","消防用設備等を設置することが義務付けられている防火対象物は、百貨店、病院、旅館等不特定多数の者が出入りする防火対象物に限られている。","戸建て一般住宅についても一定の規模を超える場合、消防用設備等の設置を義務付けられる場合がある。"],"answerIndex":0,"explanation":"【正解：1】\n2. 同一敷地内に２以上の防火対象物があり、管理について権原を有する者が同一の者である場合は一の防火対象物とみなされるが、単に同一敷地内にあるだけでは別の防火対象物となる。\n3. 設置が義務付けられる防火対象物は、令別表第１に掲げる用途の防火対象物であり、不特定多数の者が出入りするものに限られない。\n4. 戸建て一般住宅は規模に関わらず消防用設備等の設置義務はない。ただし、住宅用防災機器を設置しなければならない。"},
{"id":59,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【２】消防用設備等の設置に関する説明として、消防法令上、正しいものは次のうちどれか。","choices":["防火対象物が開口部のない耐火構造の床又は壁で区画されているときは、それぞれ別の防火対象物とみなして消防用設備等を設置しなければならない。","防火対象物が耐火構造の壁で区画され、かつ、階層を異にするときは、それぞれ別の防火対象物とみなして消防用設備等を設置しなければならない。","複合用途防火対象物については、常にそれぞれの用途ごとに消防用設備等を設置しなければならない。","複合用途防火対象物については、主たる用途に適応する消防用設備等を設置しなければならない。"],"answerIndex":0,"explanation":"【正解：1】\n2. 開口部のない耐火構造の床又は壁で区画されていないため、別の防火対象物とはみなされない。\n3・4. 複合用途防火対象物は原則として用途ごとに消防用設備等を設置する。ただし、特定の消防用設備等を設置した場合は全体を一の防火対象物とみなすことがある。"},
{"id":60,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【３】消防用設備等の設置単位は原則として棟ごとであるが、同一棟内の部分でも別の防火対象物とみなされるものとして、消防法令上、正しいものは次のうちどれか。[編]","choices":["耐火構造の建築物で、特定防火設備である防火戸又は壁で区画された部分。","耐火建築物又は準耐火建築物で、特定防火設備である防火戸及び耐火構造の床又は壁で区画された部分。","耐火建築物で、特定防火設備である防火戸及び耐火構造の床又は壁で区画された部分。","防火構造の床又は壁で区画され、開口部は特定防火設備である防火戸で区画された部分。","防火構造の床又は壁で区画され、かつ、開口部にはドレンチャー設備が設けられた部分。","開口部のない耐火構造の床又は壁で区画された部分。","開口部のない耐火構造の床及び特定防火設備である防火戸を有する壁で区画された部分。"],"answerIndex":5,"explanation":"【正解：6】\n開口部のない耐火構造の床又は壁で区画された部分が、それぞれ別の防火対象物とみなされる。"},
{"id":61,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【４】消防用設備等を設置しなければならない防火対象物に関する説明として、消防法令上、誤っているものは次のうちどれか。","choices":["防火対象物が開口部のない耐火構造の床又は壁で区画されたときは、消防用設備等の設置について、その区画された部分をそれぞれ別の防火対象物とみなす。","複合用途防火対象物で同一の用途に供される部分は、消防用設備等の設置について、用途の管理者又は階に関係なく一の防火対象物とみなされる場合がある。","同一敷地内にある２以上の防火対象物で、外壁間の中心線からの水平距離が１階は３ｍ以下、２階以上は５ｍ以下で近接する場合、消防用設備等の設置について、１棟とみなされる。","特定防火対象物の地階で、地下街と一体を成すものとして消防長又は消防署長が指定したものは、消防用設備等の設置について、地下街の一部とみなされる場合がある。"],"answerIndex":2,"explanation":"【正解：3】\nこの近接建築物の取扱いは、屋外消火栓設備の設置に関してのみ一の建築物とみなすものであり、すべての消防用設備等に適用されるわけではない。"},
{"id":62,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【５】１階が物品販売店舗、２階が料理店である防火対象物に消防用設備等を設置する場合について、消防法令上、正しいものは次のうちどれか。","choices":["１階と２階の管理者が別であれば、それぞれ別の防火対象物とみなす。","１階と２階が耐火構造の床又は壁で区画され、かつ、開口部に特定防火設備である防火戸が設けられていれば、それぞれ別の防火対象物とみなす。","階段部分を除き、１階と２階が耐火構造の床又は壁で区画されていれば、それぞれ別の防火対象物とみなす。","１階と２階が開口部のない耐火構造の床又は壁で区画されていれば、それぞれ別の防火対象物とみなす。"],"answerIndex":3,"explanation":"【正解：4】\n設問の防火対象物は特定用途を含む一の複合用途防火対象物である。\n1. 管理者が別という理由だけでは別の防火対象物とみなされない。\n2. 開口部があるため別の防火対象物とはみなされない。\n3. 階段部分が開口部となる。"},
{"id":63,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【６】消防用設備等の設置及び維持に関する記述として、消防法令上、誤っているものは次のうちどれか。","choices":["市町村は、その地方の気候又は風土の特殊性により、消防用設備等の技術上の基準に関する政令又はこれに基づく命令の規定のみによっては防火の目的を充分に達しがたいと認めるときは、条例で当該規定と異なる規定を設けることができる。","政令別表第１（16）項に掲げる防火対象物の部分で、同表（16）項以外の防火対象物の用途のいずれかに該当する用途に供されるものは、消防用設備等の設置及び維持の技術上の基準の適用について、同一用途に供される部分を一の防火対象物とみなす。","防火対象物の構造の別を問わず、当該防火対象物が開口部のない耐火構造の床又は壁で区画されているときは、その区画された部分は、消防用設備等の設置及び維持の技術上の基準の適用について、それぞれ別の防火対象物とみなす。","政令別表第１に定める防火対象物以外の防火対象物については、消防法第17条第１項に規定する消防用設備等の設置義務はない。"],"answerIndex":1,"explanation":"【正解：2】\n例外として、スプリンクラー設備、自動火災報知設備、ガス漏れ火災警報設備、漏電火災警報器等は令第９条の適用を受けず、複合用途防火対象物として設置・維持しなければならない。"},
{"id":64,"category":"消防関係法令（共通）｜防火対象物の適用・令8区画・令9条","question":"【７】消防用設備等を設置しなければならない防火対象物の説明について、消防法令上、誤っているものは次のうちどれか。","choices":["防火対象物が、開口部のない耐火構造の床又は壁で区画されているときの消防用設備等の設置及び維持の技術上の基準の適用については、それぞれ別の防火対象物とみなされる。","一の用途が他の用途の従属的な部分と認められるときにあっては、その主たる用途の防火対象物として消防用設備等を設置しなければならない。","複合用途防火対象物であっても、非常警報設備等の特定の消防用設備等を設置している場合にあっては、全体を一の防火対象物とみなす場合がある。","防火対象物が耐火構造の床で区画され、かつ、階層を異にするときの消防用設備等の設置及び維持の技術上の基準の適用については、それぞれ別の防火対象物とみなす。"],"answerIndex":3,"explanation":"【正解：4】\n原則として、防火対象物が開口部のない耐火構造の床又は壁で区画されているときに、それぞれ別の防火対象物とみなされる。"},{"id":65,"category":"消防関係法令（共通）｜防火管理・防火管理者・統括防火管理者","question":"【５】防火管理に関する次の記述について、文中の（ ）に当てはまる語句の組合せとして、消防法令上、正しいものはどれか。\n「（ア）は消防の用に供する設備、消防用水若しくは消火活動上必要な施設の（イ）及び整備又は火気の使用若しくは取扱いに関する監督を行うときは、火元責任者その他の防火管理の業務に従事する者に対し、必要な指示を与えなければならない。」\n（ア）／（イ）","choices":["防火管理者／工事","管理について権原を有する者／工事","管理について権原を有する者／点検","防火管理者／点検"],"answerIndex":3,"explanation":"【正解：4】"},
{"id":66,"category":"消防関係法令（共通）｜防火管理・防火管理者・統括防火管理者","question":"【６】次の消防法施行令別表第１に掲げる防火対象物のうち、消防法令上、防火管理者を定めなくてもよいものを、次のうちから４つ答えなさい。","choices":["老人短期入所施設で、収容人員が10人のもの","老人短期入所施設で、収容人員が20人のもの","飲食店で、収容人員が20人のもの","集会場で、収容人員が30人のもの","旅館で、収容人員が30人のもの","物品販売店舗で、収容人員が30人のもの","カラオケボックスで、収容人員が30人のもの","共同住宅で、収容人員が45人のもの","共同住宅で、収容人員が40人のもの","図書館で、収容人員が50人のもの","事務所で、収容人員が50人のもの","事務所で、収容人員が40人のもの"],"answerIndices":[2,7,8,11],"explanation":"【正解：3・8・9・12】\n1・2. 老人短期入所施設は収容人員が10人以上の場合に、防火管理者を定めなければならない。\n3〜7. 飲食店・集会場・旅館・物品販売店舗・カラオケボックスは特定防火対象物に該当するため、収容人員が30人以上の場合に防火管理者を定めなければならない。\n8〜12. 共同住宅・図書館・事務所は非特定防火対象物に該当するため、収容人員が50人以上の場合に防火管理者を定めなければならない。"},
{"id":67,"category":"消防関係法令（共通）｜防火管理・防火管理者・統括防火管理者","question":"【７】次の管理について権原が分かれている防火対象物のうち、統括防火管理者を定めなければならないものとして、消防法令上、誤っているものはどれか。ただし、防火対象物は、高層建築物（高さ31ｍを超える建築物）ではないものとする。","choices":["地階を除く階数が３の特別養護老人ホームで、収容人員が60人のもの","地階を除く階数が５の事務所で、収容人員が80人のもの","２階をカラオケボックスとして使用する地階を除く階数が３の複合用途防火対象物で、収容人員が50人のもの","地階を除く階数が５の病院で、収容人員が70人のもの"],"answerIndex":1,"explanation":"【正解：2】\n1. 階数が３以上で、収容人員が10人以上であるため、統括防火管理者を定めなければならない。\n2. 特定防火対象物ではなく、さらに複合用途防火対象物でもないため、統括防火管理者を定めなくてもよい。\n3. 特定用途を含む複合用途防火対象物であり、収容人員が30人以上であるため、統括防火管理者を定めなければならない。\n4. 特定防火対象物であり、階数が３以上で収容人員が30人以上であるため、統括防火管理者を定めなければならない。"},
{"id":68,"category":"消防関係法令（共通）｜防火管理・防火管理者・統括防火管理者","question":"【８】次のアからウまでの管理について権原が分かれている防火対象物のうち、統括防火管理者を定めなければならないものとして、消防法令上、正しいものの組合せは次のうちどれか。ただし、防火対象物は、高層建築物（高さ31ｍを超える建築物）ではないものとする。\nア. 地階を除く階数が５の作業場で、収容人員が80人のもの\nイ. 地階を除く階数が４の病院で、収容人員が40人のもの\nウ. 地階を除く階数が３の特別養護老人ホームで、収容人員が20人のもの","choices":["ア、イのみ","ア、ウのみ","イ、ウのみ","ア、イ、ウすべて"],"answerIndex":2,"explanation":"【正解：3】\nア. 特定防火対象物ではなく、さらに複合用途防火対象物でもないため、統括防火管理者を定めなくてもよい。\nイ. 特定防火対象物であり、階数が３以上で収容人員が30人以上であるため、統括防火管理者を定めなければならない。\nウ. 階数が３以上で、収容人員が10人以上であるため、統括防火管理者を定めなければならない。"},
{"id":69,"category":"消防関係法令（共通）｜防火管理・防火管理者・統括防火管理者","question":"【９】管理について権原が分かれている防火対象物のうち、統括防火管理者を定めなければならないものとして、消防法令上、誤っているものは次のうちどれか。なお、高層建築物とは、高さ31ｍを超える建築物をいう。","choices":["高層建築物に該当しない地階を除く階数が５のホテルで、収容人員が45人のもの","高層建築物に該当しない地階を除く階数が３の飲食店で、収容人員が60人のもの","高層建築物に該当しない地階を除く階数が７の事務所ビルで、収容人員が80人のもの","高層建築物に該当する地階を除く階数が13の共同住宅で、収容人員が40人のもの"],"answerIndex":2,"explanation":"【正解：3】\n1・2. 地階を除く階数が３以上で、収容人員が30人以上のため、統括防火管理者を定めなければならない。\n3. 特定防火対象物に該当しない事務所ビルは対象外である。\n4. 高層建築物に該当するため、統括防火管理者を定めなければならない。"},
{"id":70,"category":"消防関係法令（共通）｜検定対象機械器具等の検定","question":"【１】消防の用に供する機械器具等の検定に関する次の記述のうち、消防法令上、正しいものの組合せはどれか。\nア. 検定対象機械器具等は、型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が付されているものでなければ、販売の目的で陳列してはならない。\nイ. 検定対象機械器具等は、型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が付されているものでなければ、販売してはならない。\nウ. 検定対象機械器具等のうち消防の用に供する機械器具又は設備は、型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が付されているものでなければ、その設置の請負に係る工事に使用してはならない。","choices":["ア、イのみ","ア、ウのみ","イ、ウのみ","ア、イ、ウすべて"],"answerIndex":3,"explanation":"【正解：4】"},
{"id":71,"category":"消防関係法令（共通）｜検定対象機械器具等の検定","question":"【２】検定対象機械器具等の型式承認に関する記述について、文中の（ ）に当てはまる語句の組合せとして、消防法令上、正しいものは次のうちどれか。\n「型式承認とは、検定対象機械器具等の型式に係る（ア）が総務省令で定める検定対象機械器具等に係る技術上の（イ）に適合している旨の承認をいう。」\n（ア）／（イ）","choices":["要件等／性能","要件等／規格","形状等／性能","形状等／規格"],"answerIndex":3,"explanation":"【正解：4】"},
{"id":72,"category":"消防関係法令（共通）｜検定対象機械器具等の検定","question":"【３】消防の用に供する機械器具等の検定について、消防法令上、正しいものは次のうちどれか。","choices":["型式承認とは、検定対象機械器具等の型式に係る形状等が総務省令で定める検定対象機械器具等に係る技術上の規格に適合している旨の承認をいう。","検定対象機械器具等は、型式承認を受けたものである旨の表示が付されているものであれば、販売の目的で陳列することができる。","型式適合検定とは、型式承認を受けていない検定対象機械器具等の形状等が型式に係る形状等に適合しているかどうかについて総務省令で定める方法により行う検定をいう。","検定対象機械器具等のうち消防の用に供する機械器具又は設備は、型式承認を受けたものである旨の表示が付されているものであれば、その設置、変更又は修理の請負に係る工事に使用することができる。"],"answerIndex":0,"explanation":"【正解：1】\n2・4. 型式承認を受けたものであり、かつ、型式適合検定に合格したものである旨の表示が必要。\n3. 型式適合検定の対象は、あらかじめ型式承認を受けた検定対象機械器具等である。"},
{"id":73,"category":"消防関係法令（共通）｜検定対象機械器具等の検定","question":"【４】消防の用に供する機械器具等の検定に係る表示に関する次の記述のうち、文中の（ ）に当てはまる語句として、消防法令上、正しいものは次のうちどれか。\n「検定対象機械器具等は、型式承認を受けたものであり、かつ、（ ）の表示が付されているものでなければ、販売の目的で陳列してはならない。」","choices":["技術上の規格に適合するものである旨","設備等技術基準に適合するものである旨","型式適合検定に合格したものである旨","性能評価を受けたものである旨"],"answerIndex":2,"explanation":"【正解：3】"},{"id":74,"category":"消防関係法令（共通）｜消防設備士免状の再交付・返納等","question":"【10】次の文中の（ ）に当てはまる数値及び語句の組合せとして、消防法令に定められているものは次のうちどれか。\n「消防設備士免状を亡失してその再交付を受けた者は、亡失した免状を発見した場合には、これを（ア）日以内に免状の再交付をした（イ）に提出しなければならない。」\n（ア）／（イ）","choices":["10／都道府県知事","10／消防長又は消防署長","14／都道府県知事","14／消防長又は消防署長"],"answerIndex":0,"explanation":"【正解：1】\n亡失した免状を発見した場合は、10日以内に免状の再交付をした都道府県知事に提出しなければならない。"},
{"id":75,"category":"消防関係法令（共通）｜消防設備士免状の再交付・返納等","question":"【11】消防設備士免状の返納について、消防法令上、誤っているものは次のうちどれか。","choices":["返納を命ずるのは、消防長又は消防署長である。","返納を命ずることができるのは、消防設備士が消防法令上の規定に違反している場合である。","免状の返納命令に従わない場合には、罰則の適用がある。","免状の返納命令により、消防設備士の資格を喪失する。"],"answerIndex":0,"explanation":"【正解：1】\n免状の返納を命ずるのは、消防長又は消防署長ではなく、免状を交付した都道府県知事である。"},
{"id":76,"category":"消防関係法令（共通）｜消防設備士免状の再交付・返納等","question":"【12】消防設備士が消防法令上の規定に違反しているとき、当該消防設備士の免状の返納を命ずることができる者として、正しいものは次のうちどれか。","choices":["消防設備士の免状を交付した都道府県知事","消防設備士が違反した場所を管轄する都道府県知事","消防設備士の居住地又は勤務地を管轄する都道府県知事","消防設備士の本籍地の属する都道府県知事"],"answerIndex":0,"explanation":"【正解：1】\n免状の返納を命ずることができるのは、免状を交付した都道府県知事である。"},
{"id":77,"category":"消防関係法令（共通）｜消防設備士の講習","question":"【１】工事整備対象設備等の工事又は整備に関する講習の実施者として、消防法令上、正しいものは次のうちどれか。","choices":["都道府県知事","総務大臣","消防長又は消防署長","消防庁長官"],"answerIndex":0,"explanation":"【正解：1】"},
{"id":78,"category":"消防関係法令（共通）｜消防設備士の講習","question":"【２】都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習について、消防法令上、誤っているものは次のうちどれか。","choices":["消防設備士免状の交付を受けた日から５年以内ごとに受講しなければならない。","工事整備対象設備等の工事又は整備に従事していない消防設備士も受講しなければならない。","消防設備士免状の種類及び指定区分等に応じて行われる。","定められた期間内に受講しなければ、消防設備士免状の返納を命ぜられることがある。"],"answerIndex":0,"explanation":"【正解：1】\n１回目の講習は、免状交付日以降における最初の４月１日から２年以内に受講しなければならない。"},
{"id":79,"category":"消防関係法令（共通）｜消防設備士の講習","question":"【３】都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習の制度について、消防法令上、正しいものは次のうちどれか。","choices":["消防設備士は、その業務に従事することになった日以降における最初の４月１日から５年以内ごとに講習を受けなければならない。","消防設備士は、免状の交付を受けた日以降における最初の４月１日から５年以内ごとに講習を受けなければならない。","消防設備士は、その業務に従事することになった日以降における最初の４月１日から２年以内に講習を受け、その後、前回の講習を受けた日以降における最初の４月１日から５年以内ごとに講習を受けなければならない。","消防設備士は、免状の交付を受けた日以降における最初の４月１日から２年以内に講習を受け、その後、前回の講習を受けた日以降における最初の４月１日から５年以内ごとに講習を受けなければならない。"],"answerIndex":3,"explanation":"【正解：4】\n講習は、免状の交付を受けた日以降における最初の４月１日から２年以内に１回目を受講し、その後は前回の講習を受けた日以降における最初の４月１日から５年以内ごとに受講する。"},
{"id":80,"category":"消防関係法令（共通）｜消防設備士の講習","question":"【４】工事整備対象設備等の工事又は整備に関する講習についての記述のうち、文中の（ ）に当てはまる語句の組合せとして、消防法令上、正しいものは次のうちどれか。\n「消防設備士は、（ア）日以降における最初の４月１日から（イ）以内に講習を受けなければならない。」\n（ア）／（イ）","choices":["工事整備対象設備等の工事又は整備に従事することとなった／２年","免状の交付を受けた／５年","工事整備対象設備等の工事又は整備に従事することとなった／５年","免状の交付を受けた／２年"],"answerIndex":3,"explanation":"【正解：4】\n免状の交付を受けた日以降における最初の４月１日から２年以内に講習を受けなければならない。"},
{"id":81,"category":"消防関係法令（共通）｜消防設備士の講習","question":"【５】都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習の受講時期について、消防法令で定められているものは、次のうちどれか。","choices":["免状の交付を受けた日から２年以内、その後、前回の講習を受けた日から５年以内ごと","免状の交付を受けた日以降における最初の４月１日から１年以内、その後、前回の講習を受けた日以降における最初の４月１日から３年以内ごと","免状の交付を受けた日以降における最初の４月１日から２年以内、その後、前回の講習を受けた日以降における最初の４月１日から５年以内ごと","免状の交付を受けた日以降における最初の４月１日から５年以内、その後、前回の講習を受けた日以降における最初の４月１日から２年以内ごと","免状の交付を受けた日から３年以内ごと","免状の交付を受けた日から５年以内ごと"],"answerIndex":2,"explanation":"【正解：3】"},
{"id":82,"category":"消防関係法令（共通）｜消防設備士の義務","question":"【１】消防設備士の義務について、消防法令上、誤っているものは次のうちどれか。","choices":["消防用設備等が設備等技術基準に違反して設置又は維持されている場合、消防設備士は消防長又は消防署長に届け出なければならない。","消防設備士は、その業務に従事する場合、消防設備士免状を携帯しなければならない。","消防設備士は、業務を誠実に行い工事整備対象設備等の質の向上に努めなければならない。","消防設備士は、都道府県知事（総務大臣が指定する市町村長その他の機関を含む。）が行う工事整備対象設備等の工事又は整備に関する講習を受けなければならない。"],"answerIndex":0,"explanation":"【正解：1】\n消防法令に、このような届出義務の規定はない。"},{"id":83,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【１】消防設備士免状に関する次の記述について、消防法令上、正しいものを２つ選びなさい。","choices":["消防設備士免状の交付を受けた都道府県以外で業務に従事するときは、業務地を管轄する都道府県知事に免状の書換えを申請しなければならない。","消防設備士免状の記載事項に変更を生じた場合、当該免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に免状の書換えを申請しなければならない。","消防設備士免状を亡失したときは、亡失した日から10日以内に免状の再交付を申請しなければ、当該免状は自動的に失効する。","消防設備士免状の返納を命ぜられた日から３年を経過しない者については、新たに試験に合格しても免状が交付されないことがある。","消防設備士免状の返納を命ぜられた日から１年を経過しない者については、新たに試験に合格しても免状が交付されないことがある。"],"answerIndices":[1,4],"explanation":"【正解：2・5】\n1. 業務地に関する規定はなく、免状は全国で有効。\n2. 記載事項に変更が生じた場合は、免状を交付した都道府県知事、居住地又は勤務地を管轄する都道府県知事のいずれかに書換えを申請する。\n3. 亡失した場合の再交付申請に期限はない。\n4・5. 返納を命ぜられて１年を経過しない者等については、免状を交付しないことができる。"},
{"id":84,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【２】消防設備士免状に関して、消防法令上、誤っているものは次のうちどれか。","choices":["消防設備士免状の記載事項に変更を生じたときは、免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に免状の書換えを申請しなければならない。","消防設備士免状を亡失したときは、亡失に気付いた日から10日以内に免状を交付した都道府県知事に免状の再交付を申請しなければならない。","消防設備士免状を汚損又は破損した者は、免状を交付した都道府県知事に免状の再交付を申請することができる。","消防設備士免状の返納命令に違反した者は、罰金又は拘留に処せられることがある。"],"answerIndex":1,"explanation":"【正解：2】\n免状を亡失した場合の再交付申請には期限が設けられていない。"},
{"id":85,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【３】消防設備士免状の書換えについて、消防法令上、正しいものは次のうちどれか。","choices":["免状に貼ってある写真が撮影した日から10年を超えた場合は、居住地又は勤務地を管轄する消防長又は消防署長に書換えの申請をしなければならない。","居住地に変更が生じた場合は、居住地又は勤務地を管轄する都道府県知事に書換えの申請をしなければならない。","氏名に変更が生じた場合は、免状を交付した都道府県知事又は居住地若しくは勤務地を管轄する都道府県知事に書換えの申請をしなければならない。","本籍地の属する都道府県に変更が生じた場合は、新たな本籍地を管轄する消防長又は消防署長に書換えの申請をしなければならない。"],"answerIndex":2,"explanation":"【正解：3】\n氏名の変更は免状の記載事項の変更に該当する。書換えは免状を交付した都道府県知事、居住地又は勤務地を管轄する都道府県知事に申請する。"},
{"id":86,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【４】消防設備士免状を亡失した場合の再交付申請先として、消防法令上、正しいものは次のうちどれか。","choices":["居住地又は勤務地を管轄する都道府県知事","居住地又は勤務地を管轄する消防長又は消防署長","当該免状の交付又は書換えをした都道府県知事","当該免状の交付又は書換えをした消防長又は消防署長"],"answerIndex":2,"explanation":"【正解：3】\n免状を亡失した場合は、当該免状の交付又は書換えをした都道府県知事に再交付を申請する。"},
{"id":87,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【５】消防設備士免状を亡失してその再交付を受けた者が、亡失した免状を発見した場合は、これを一定期間以内に免状の再交付をした都道府県知事に提出しなければならないとされているが、その期間として、消防法令上、正しいものは次のうちどれか。","choices":["７日以内","10日以内","14日以内","20日以内"],"answerIndex":1,"explanation":"【正解：2】\n亡失した免状を発見した場合は、10日以内に再交付をした都道府県知事に提出する。"},
{"id":88,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【６】交付を受けている消防設備士免状の記載事項の変更に係る書換えの申請先として、消防法令上、誤っているものは次のうちどれか。","choices":["居住地を管轄する都道府県知事","勤務地を管轄する都道府県知事","本籍地を管轄する都道府県知事","免状の交付を受けた都道府県知事"],"answerIndex":2,"explanation":"【正解：3】\n書換えの申請先は、免状を交付した都道府県知事、居住地又は勤務地を管轄する都道府県知事。本籍地を管轄する都道府県知事ではない。"},
{"id":89,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【７】消防設備士免状に関する申請とその申請先について、消防法令上、誤っているものの組合せは次のうちどれか。\n（申請／申請先）","choices":["書換え／居住地又は勤務地を管轄する都道府県知事","再交付／免状を交付した都道府県知事","書換え／免状を交付した都道府県知事","再交付／居住地又は勤務地を管轄する都道府県知事"],"answerIndex":3,"explanation":"【正解：4】\n再交付は、当該免状の交付又は書換えをした都道府県知事に申請する。居住地又は勤務地を管轄する都道府県知事ではない。"},
{"id":90,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【８】消防設備士免状の書換えまたは再交付に関する記述として、消防法令上、正しいものは次のうちどれか。","choices":["消防設備士免状の交付を受けている者は、当該免状の交付を受けた都道府県以外の地域で業務に従事するときでも、免状の記載事項に変更がなければ、免状の書換えを申請する必要はない。","消防設備士免状の交付を受けている者は、当該免状の写真が撮影から10年を経過した場合でも、免状の記載事項に変更がなければ、免状の書換えを申請する必要はない。","消防設備士免状の交付を受けている者で、当該免状を破損した場合には、破損した日から10日以内に当該免状を交付または書換えをした都道府県知事に、その再交付を申請しなければならない。","消防設備士免状を亡失してその再交付を受けた者は、亡失した免状を発見した場合には、これを14日以内に再交付を受けた都道府県知事に提出しなければならない。"],"answerIndex":0,"explanation":"【正解：1】\n業務地に関する規定はなく、免状は全国で有効。写真が撮影から10年を超えた場合は書換えが必要。破損等による再交付申請に期限はなく、亡失した免状を発見した場合の提出期限は10日以内。"},
{"id":91,"category":"消防関係法令（共通）｜消防設備士免状の書換え・再交付等","question":"【９】消防設備士免状の記載事項について、消防法令に定められていないものは、次のうちどれか。","choices":["免状の交付年月日及び交付番号","氏名及び生年月日","現住所","過去10年以内に撮影した写真"],"answerIndex":2,"explanation":"【正解：3】\n消防設備士免状の記載事項に、現住所は含まれていない。"}];
const KEY="shobo-kakomon-progress-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){saved={}}
let list=[],pos=0,current=null,done=false,selectedChoice=[],sessionOK=0;const $=id=>document.getElementById(id);
function rec(id){return saved[id]||{attempts:0,correct:0,wrong:0,bookmarked:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(){let a=Object.values(saved),n=a.reduce((s,r)=>s+(r.attempts||0),0),c=a.reduce((s,r)=>s+(r.correct||0),0),w=a.reduce((s,r)=>s+(r.wrong||0),0);$("accuracy").textContent=n?Math.round(c/n*100)+"%":"—";$("correctCount").textContent=c;$("wrongCount").textContent=w;$("progress").textContent=Math.min(pos+(current?1:0),list.length)+" / "+list.length;$("bar").style.width=(list.length?Math.min(pos+(current?1:0),list.length)/list.length*100:0)+"%"}
function start(){let m=$("mode").value;list=QUESTIONS.filter(q=>$("scope").value==="all"||q.category.startsWith("消防関係法令（共通）"));if(m==="review")list=list.filter(q=>{let r=rec(q.id);return r.wrong>0||r.bookmarked});if(m==="random")list=shuffle(list);pos=0;sessionOK=0;current=null;draw()}
function draw(){stats();if(!list.length){$("stage").innerHTML='<section class="card empty"><strong>出題できる問題がありません</strong>間違えた問題も復習チェックもまだありません。通常モードで学習してください。</section>';return}if(pos>=list.length){$("stage").innerHTML='<section class="card empty"><strong>今回の演習は終了！</strong>今回の正解数：'+sessionOK+' / '+list.length+'<p><button class="next" id="again">もう一度解く ↻</button></p></section>';$("again").onclick=start;return}current=list[pos];done=false;selectedChoice=[];let r=rec(current.id);const multi=Array.isArray(current.answerIndices);$("stage").innerHTML='<section class="card"><div class="qtop"><span class="tag">'+esc(current.category)+'</span><span>問題 '+(pos+1)+' / '+list.length+'</span></div><div class="qnum">QUESTION '+String(current.id).padStart(3,"0")+'</div><div class="question">'+esc(current.question)+'</div><div class="selection-hint" id="selectionHint" style="font-size:13px;color:var(--muted);margin:-8px 0 10px">'+(multi?'正しいと思うものを'+current.answerIndices.length+'つ選択してください（0 / '+current.answerIndices.length+')':'選択肢を1つ選んでください')+'</div><div class="choices">'+current.choices.map((v,i)=>'<button class="choice" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+esc(v)+'</span></button>').join("")+'</div><div class="actions"><label class="bookmark"><input type="checkbox" id="bookmark" '+(r.bookmarked?"checked":"")+'> あとで復習する</label><button class="next" id="next" disabled>解答する</button></div></section><section class="explain" id="explain" aria-live="polite"></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>selectChoice(+b.dataset.i));$("bookmark").onchange=e=>{let x=rec(current.id);x.bookmarked=e.target.checked;saved[current.id]=x;save()};$("next").onclick=()=>{if(done)next();else submitAnswer()};stats()}
function selectChoice(i){if(done)return;const multi=Array.isArray(current.answerIndices);if(multi){if(selectedChoice.includes(i))selectedChoice=selectedChoice.filter(x=>x!==i);else if(selectedChoice.length<current.answerIndices.length)selectedChoice.push(i)}else selectedChoice=[i];document.querySelectorAll(".choice").forEach((b,j)=>b.classList.toggle("selected",selectedChoice.includes(j)));const required=multi?current.answerIndices.length:1;$("selectionHint").textContent=multi?"正しいと思うものを"+required+"つ選択してください（"+selectedChoice.length+" / "+required+"）":"選択肢を1つ選んでください";$("next").disabled=selectedChoice.length!==required}
function submitAnswer(){const answers=Array.isArray(current.answerIndices)?current.answerIndices:[current.answerIndex];if(done||selectedChoice.length!==answers.length)return;done=true;const chosen=[...selectedChoice].sort((a,b)=>a-b),correct=[...answers].sort((a,b)=>a-b);const ok=chosen.length===correct.length&&chosen.every((v,i)=>v===correct[i]);let r=rec(current.id);r.attempts++;if(ok){r.correct++;sessionOK++}else r.wrong++;saved[current.id]=r;save();document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(answers.includes(j))b.classList.add("correct");if(selectedChoice.includes(j)&&!answers.includes(j))b.classList.add("wrong")});$("explain").innerHTML='<div class="result '+(ok?"good":"bad")+'">'+(ok?"✓ 正解！":"✕ 不正解")+'</div><div>正解は <strong>'+answers.map(x=>x+1).join("・")+'番</strong> です。</div><h2>解説</h2>'+esc(current.explanation);$("explain").classList.add("show");$("next").textContent="次の問題へ ➔";$("next").disabled=false;stats()}
function next(){if(!done)return;pos++;draw();window.scrollTo({top:0,behavior:"smooth"})}
$("mode").onchange=start;$("scope").onchange=start;document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(!done&&/^[1-8]$/.test(e.key)&&+e.key<=current.choices.length)selectChoice(+e.key-1);else if(!done&&e.key==="Enter"&&selectedChoice.length===(Array.isArray(current.answerIndices)?current.answerIndices.length:1))submitAnswer();else if(done&&(e.key==="Enter"||e.key===" "))next()});start();
</script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>消防設備士 過去問演習</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#202938;--muted:#697586;--line:#e4e8ee;--red:#a8323e;--green:#18794e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}.head,main{max-width:850px;margin:auto}.head{padding:12px 18px;font-weight:800}.head b{color:var(--red)}main{padding:20px 14px 70px}.panel,.card,.explain{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:14px}.controls{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700}select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px}.stats strong{color:var(--ink)}.track{height:6px;background:#edf0f4;border-radius:9px;margin-top:10px;overflow:hidden}.track div{height:100%;background:var(--red);width:0}.qtop{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.tag{background:#f1f3f6;border-radius:30px;padding:3px 9px}.qnum{color:var(--red);font-weight:800;font-size:13px;margin-top:12px}.question{font-size:clamp(19px,3vw,23px);font-weight:750;line-height:1.55;margin:8px 0 20px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}.choice:hover:not(:disabled){background:#fafbfc;border-color:#aab4c2}.num{flex:none;background:#f0f2f5;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-weight:800}.choice.selected{background:#f1f8e9;border:2px solid #4b9500;padding:13px}.choice.correct{background:#eaf7f0;border-color:#65b88b;color:#145d3d}.choice.correct .num{background:#ccebd9}.choice.wrong{background:#fff0f1;border-color:#e19aa1;color:#8e2530}.choice.wrong .num{background:#f7d7da}.choice:disabled{cursor:default}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.bookmark{font-size:14px;color:var(--muted)}.bookmark input{width:18px;height:18px;vertical-align:middle;accent-color:var(--red)}.next{background:var(--red);color:white;border:0;border-radius:11px;padding:13px 22px;font-weight:800;min-width:185px}.next:disabled{opacity:.4;cursor:not-allowed}.explain{display:none;white-space:pre-wrap}.explain.show{display:block}.result{font-size:19px;font-weight:850}.good{color:var(--green)}.bad{color:var(--red)}.explain h2{font-size:15px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:8px}@media(max-width:560px){.head{padding:10px 14px}main{padding:13px 11px 60px}.panel,.card,.explain{padding:15px}.actions{align-items:stretch}.bookmark{flex:1}.next{width:100%;order:2}.choice{padding:13px}}
</style></head><body><header><div class="head"><b>消防設備士</b> 過去問演習</div></header><main>
<section class="panel"><div class="controls"><div class="field"><label for="mode">出題モード</label><select id="mode"><option value="ordered">順番に出題</option><option value="random">ランダム出題</option><option value="review">間違えた問題・復習チェックのみ</option></select></div><div class="field"><label for="scope">出題範囲</label><select id="scope"><option value="all">すべての問題</option><option value="category">消防関係法令（共通）</option></select></div></div><div class="stats"><span>進捗 <strong id="progress">0 / 2</strong></span><span>正答率 <strong id="accuracy">—</strong></span><span>正解 <strong id="correctCount">0</strong></span><span>不正解 <strong id="wrongCount">0</strong></span></div><div class="track"><div id="bar"></div></div></section><div id="stage"></div><small style="color:#697586">学習履歴と復習チェックは、このブラウザに自動保存されます。</small></main>
<script>
/* 問題データ：ユーザー提供JSONのみ。追加時は配列末尾にJSONを追加してください。 */
const QUESTIONS = [
{"id":1,"category":"消防関係法令（共通）","question":"次の記述のうち、消防法令上、誤っているものはどれか。","choices":["消防用設備等とは、消防の用に供する設備、消防用水及び消火活動上必要な施設をいう。","防火対象物の関係者とは、防火対象物の所有者、管理者又は占有者をいう。","消防用設備等を設置することが義務付けられている防火対象物は、病院、旅館等不特定多数の者が出入りする防火対象物に限られる。","戸建て一般住宅については、消防用設備等の設置義務はない。"],"answerIndex":2,"explanation":"【正解：3】\n1. 法第17条1項。\n2. 法第2条4項。\n3. 消防用設備等の設置が義務付けられている防火対象物は、令別表第1（17P参照）に掲げる用途の防火対象物である。病院、旅館等不特定多数の者が出入りする防火対象物に限られているわけではない。\n4. 戸建て一般住宅については、「消防用設備等」の設置義務はないが、法第9条の2により、「住宅用防災機器」の設置義務がある。"},
{"id":2,"category":"消防関係法令（共通）","question":"消防用設備等に関する記述として、消防法令上、正しいものは次のうちどれか。","choices":["消防用設備等を設置することが義務付けられている防火対象物は、学校、病院及び旅館等の不特定多数の者が出入りする防火対象物に限られている。","戸建て一般住宅についても、一定の規模を超える場合、消防用設備等を設置しなければならない。","消防用設備等とは、消防の用に供する設備及び消火活動上必要な施設をいう。","政令で定める防火対象物の関係者は、政令で定める技術上の基準に従って消防用設備等を設置し、及び維持する義務がある。"],"answerIndex":3,"explanation":"【正解：4】\n1. 消防用設備等の設置が義務付けられている防火対象物は、令別表第1（17P参照）に掲げる用途の防火対象物である。\n2. 戸建て一般住宅は、その規模に関わらず「消防用設備等」を設置しなくてよい。ただし、「住宅用防災機器」を設置しなければならない。\n3. 消防用設備等とは、消防の用に供する設備、「消防用水」及び消火活動上必要な施設をいう。「消防用水」が抜けている。\n4. 法第17条1項。"}
,
{"id":3,"category":"消防関係法令（共通）","question":"【１】消防法令に定める「関係者」として、誤っているものは次のうちどれか。","choices":["防火対象物の管理者","消防対象物の所有者","防火対象物の防火管理者","消防対象物の占有者"],"answerIndex":2,"explanation":"正解：3"},
{"id":4,"category":"消防関係法令（共通）","question":"【２】無窓階の説明として、消防法令上、正しいものは次のうちどれか。[編]","choices":["建築物の外壁に窓を有しない階","採光上又は排煙上有効な開口部を有しない階","排煙上又は消火活動上有効な窓が一定基準に達しない階","消火活動上有効な窓が一定基準に達しない階","消火活動上有効な窓を有しない階","避難上又は排煙上有効な開口部が一定基準に達しない階","窓を有しない階","避難上又は消火活動上有効な開口部を有しない階"],"answerIndex":7,"explanation":"正解：8"},
{"id":5,"category":"消防関係法令（共通）","question":"【３】避難上又は消火活動上有効な開口部を有しない階（以下「無窓階」という。）と当該開口部の基準において、消防法令上、誤っているものは次のうちどれか。[★]","choices":["床面から当該開口部の下端までの高さが1.2ｍ以内であること。","当該開口部は、格子その他の内部から容易に避難することを妨げる構造を有しないものであり、かつ、外部から開放し、容易に破壊することにより進入できるものであること。","10階以下の防火対象物にあっては、当該開口部は、道又は道に通ずる幅員１ｍ以上の通路その他の空地に面したものであること。","10階以下の防火対象物にあっては、無窓階とは、直径50cm以上の円が内接することができる開口部の面積の合計が、当該階の床面積の30分の１を超える階以外の階をいう。"],"answerIndex":3,"explanation":"【正解：4】\nこの問題は、設問の指示部分で「ただし書き」が追加されている可能性がある（編集部）。\n4. 設問の内容は、11階以上の防火対象物を対象とした無窓階の定義である。"},
{"id":6,"category":"消防関係法令（共通）","question":"【４】規則に定める、避難上又は消火活動上有効な開口部を有しない階（以下「無窓階」という。）と当該開口部の基準として、正しいものは次のうちどれか。","choices":["11階以上の階の当該開口部は、道又は道に通ずる幅員１ｍ以上の通路その他の空地に面したものであること。","高さ31ｍを超える階にあっては、直径50cm以上の円が内接することができる開口部の面積の合計が、当該階の床面積の30分の１を超える階以外の階をいう。","当該開口部は、格子その他の内部から容易に避難することを妨げる構造を有しないものであり、かつ、外部から開放し、又は容易に破壊することにより進入できるものであること。","床面から当該開口部の下端までの高さは、1.5ｍ以内であること。"],"answerIndex":2,"explanation":"【正解：3】\n1. 「10階以下の階」の当該開口部は、道又は道に通ずる幅員１ｍ以上の通路その他の空地に面したものであること。\n2. 「11階以上の階」にあっては、直径50cm以上の円が内接することができる開口部の面積の合計が当該階の床面積の30分の１を超える階（普通階）以外の階を無窓階という。\n4. 床面から当該開口部の下端までの高さは、「1.2ｍ以内」であること。"},
{"id":7,"category":"消防関係法令（共通）","question":"【５】消防法令に定められている用語の定義として、誤っているものを３つ選びなさい。[編]","choices":["防火対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物又は物件をいう。","消防対象物とは、山林又は舟車、船きょ若しくはふ頭に繋留された船舶、建築物その他の工作物若しくはこれらに属する物をいう。","関係者とは、防火対象物又は消防対象物の所有者、管理者又は占有者をいう。","関係のある場所とは、防火対象物又は消防対象物のある場所をいう。","危険物とは、消防法別表第１の品名欄に掲げる物品で、同表に定める区分に応じ同表の性質欄に掲げる性状を有するものをいう。","舟車とは、船舶安全法第２条１項の規定を適用しない船舶、端舟、はしけ、被曳船その他の舟をいう。","複合用途防火対象物とは、防火対象物で政令で定める２以上の用途に供されるものをいう。"],"answerIndices":[0,1,5],"explanation":"【正解：1・2・6】\n1. 設問の内容は消防対象物。\n2. 設問の内容は防火対象物。\n6. 舟車とは、船舶安全法第２条１項の規定を適用しない船舶、端舟、はしけ、被曳船その他の舟「及び車両」をいう。"}];
const KEY="shobo-kakomon-progress-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){saved={}}
let list=[],pos=0,current=null,done=false,selectedChoice=[],sessionOK=0;const $=id=>document.getElementById(id);
function rec(id){return saved[id]||{attempts:0,correct:0,wrong:0,bookmarked:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(){let a=Object.values(saved),n=a.reduce((s,r)=>s+(r.attempts||0),0),c=a.reduce((s,r)=>s+(r.correct||0),0),w=a.reduce((s,r)=>s+(r.wrong||0),0);$("accuracy").textContent=n?Math.round(c/n*100)+"%":"—";$("correctCount").textContent=c;$("wrongCount").textContent=w;$("progress").textContent=Math.min(pos+(current?1:0),list.length)+" / "+list.length;$("bar").style.width=(list.length?Math.min(pos+(current?1:0),list.length)/list.length*100:0)+"%"}
function start(){let m=$("mode").value;list=QUESTIONS.filter(q=>$("scope").value==="all"||q.category==="消防関係法令（共通）");if(m==="review")list=list.filter(q=>{let r=rec(q.id);return r.wrong>0||r.bookmarked});if(m==="random")list=shuffle(list);pos=0;sessionOK=0;current=null;draw()}
function draw(){stats();if(!list.length){$("stage").innerHTML='<section class="card empty"><strong>出題できる問題がありません</strong>間違えた問題も復習チェックもまだありません。通常モードで学習してください。</section>';return}if(pos>=list.length){$("stage").innerHTML='<section class="card empty"><strong>今回の演習は終了！</strong>今回の正解数：'+sessionOK+' / '+list.length+'<p><button class="next" id="again">もう一度解く ↻</button></p></section>';$("again").onclick=start;return}current=list[pos];done=false;selectedChoice=[];let r=rec(current.id);const multi=Array.isArray(current.answerIndices);$("stage").innerHTML='<section class="card"><div class="qtop"><span class="tag">'+esc(current.category)+'</span><span>問題 '+(pos+1)+' / '+list.length+'</span></div><div class="qnum">QUESTION '+String(current.id).padStart(3,"0")+'</div><div class="question">'+esc(current.question)+'</div><div class="selection-hint" id="selectionHint" style="font-size:13px;color:var(--muted);margin:-8px 0 10px">'+(multi?'正しいと思うものを3つ選択してください（0 / 3）':'選択肢を1つ選んでください')+'</div><div class="choices">'+current.choices.map((v,i)=>'<button class="choice" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+esc(v)+'</span></button>').join("")+'</div><div class="actions"><label class="bookmark"><input type="checkbox" id="bookmark" '+(r.bookmarked?"checked":"")+'> あとで復習する</label><button class="next" id="next" disabled>解答する</button></div></section><section class="explain" id="explain" aria-live="polite"></section>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>selectChoice(+b.dataset.i));$("bookmark").onchange=e=>{let x=rec(current.id);x.bookmarked=e.target.checked;saved[current.id]=x;save()};$("next").onclick=()=>{if(done)next();else submitAnswer()};stats()}
function selectChoice(i){if(done)return;const multi=Array.isArray(current.answerIndices);if(multi){if(selectedChoice.includes(i))selectedChoice=selectedChoice.filter(x=>x!==i);else if(selectedChoice.length<current.answerIndices.length)selectedChoice.push(i)}else selectedChoice=[i];document.querySelectorAll(".choice").forEach((b,j)=>b.classList.toggle("selected",selectedChoice.includes(j)));const required=multi?current.answerIndices.length:1;$("selectionHint").textContent=multi?"正しいと思うものを3つ選択してください（"+selectedChoice.length+" / "+required+"）":"選択肢を1つ選んでください";$("next").disabled=selectedChoice.length!==required}
function submitAnswer(){const answers=Array.isArray(current.answerIndices)?current.answerIndices:[current.answerIndex];if(done||selectedChoice.length!==answers.length)return;done=true;const chosen=[...selectedChoice].sort((a,b)=>a-b),correct=[...answers].sort((a,b)=>a-b);const ok=chosen.length===correct.length&&chosen.every((v,i)=>v===correct[i]);let r=rec(current.id);r.attempts++;if(ok){r.correct++;sessionOK++}else r.wrong++;saved[current.id]=r;save();document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(answers.includes(j))b.classList.add("correct");if(selectedChoice.includes(j)&&!answers.includes(j))b.classList.add("wrong")});$("explain").innerHTML='<div class="result '+(ok?"good":"bad")+'">'+(ok?"✓ 正解！":"✕ 不正解")+'</div><div>正解は <strong>'+answers.map(x=>x+1).join("・")+'番</strong> です。</div><h2>解説</h2>'+esc(current.explanation);$("explain").classList.add("show");$("next").textContent="次の問題へ ➔";$("next").disabled=false;stats()}
function next(){if(!done)return;pos++;draw();window.scrollTo({top:0,behavior:"smooth"})}
$("mode").onchange=start;$("scope").onchange=start;document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(!done&&/^[1-8]$/.test(e.key)&&+e.key<=current.choices.length)selectChoice(+e.key-1);else if(!done&&e.key==="Enter"&&selectedChoice.length===(Array.isArray(current.answerIndices)?current.answerIndices.length:1))submitAnswer();else if(done&&(e.key==="Enter"||e.key===" "))next()});start();
</script></body></html>
